<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OPAHiFi Backbone Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Oswald:wght@500;600;700&family=Poppins:wght@300;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --ophf-cover-area: 24dvh;
            --ophf-nav-button-h: 30px;
            --ophf-nav-button-w: clamp(86px, 28vw, 138px);
            --ophf-nav-gap: 8px;
            --ophf-nav-pad-top: 8px;
            --ophf-nav-pad-bottom: max(8px, env(safe-area-inset-bottom));
            --ophf-nav-h: calc(var(--ophf-nav-button-h) + var(--ophf-nav-pad-top) + var(--ophf-nav-pad-bottom));
            --ophf-topbar-h: 44px;
            --ophf-rail-h: 76px;
            --ophf-listen-btn-size: 40px;
            --ophf-listen-icon-size: 20px;
            --ophf-listen-gap: 9px;
            --ophf-promo-content-max: 900px;
            --ophf-gallery-map-max-w: calc(var(--ophf-nav-button-w) + var(--ophf-nav-button-w) + var(--ophf-nav-button-w) + var(--ophf-nav-gap) + var(--ophf-nav-gap));
            --ophf-gallery-map-max-h: 680px;
            --ophf-gallery-pad: clamp(8px, 2.5vw, 18px);
            --ophf-gallery-gap: clamp(8px, 2.4vw, 14px);
            --ophf-promo-band-h: clamp(68px, 13dvh, 92px);
            --ophf-main-h: calc(100dvh - var(--ophf-cover-area) - var(--ophf-nav-h));
            --ophf-main-h-detail: calc(100dvh - var(--ophf-cover-area) - var(--ophf-nav-h) - var(--ophf-rail-h));
            --ophf-gallery-panel-h: calc(100dvh - var(--ophf-cover-area) - var(--ophf-nav-h) - (var(--ophf-gallery-pad) * 2));
            --ophf-black: #020204;
            --ophf-purple: #25123D;
            --ophf-royal: #182475;
            --ophf-blue: #254EB5;
            --ophf-bright: #6B95DC;
            --ophf-violet: #6351B4;
            --ophf-magenta: #C34DAC;
            --ophf-pink: #E44261;
            --ophf-red: #770D1F;
            --ophf-fire: #DC3612;
            --ophf-lavender: #BFBEEE;
            --ophf-light: #F8F8F8;
            --ophf-node: 60px;
            --ophf-node-label-h: 18px;
            --ophf-node-label-gap: 5px;
            --ophf-node-total: calc(var(--ophf-node) + var(--ophf-node-label-h) + var(--ophf-node-label-gap));
            --ophf-node-art-h: 153.846%;
            --ophf-radius-xl: 26px;
            --ophf-radius-md: 18px;
            --ophf-ease: 180ms ease;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--ophf-black);
            color: var(--ophf-light);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        select,
        a {
            font: inherit;
        }

        button {
            border: 0;
            color: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .ophf-app {
            position: relative;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background:
                radial-gradient(circle at 25% 10%, rgba(195, 77, 172, 0.25), transparent 28%),
                radial-gradient(circle at 80% 34%, rgba(37, 78, 181, 0.22), transparent 32%),
                linear-gradient(180deg, #040407 0%, #10071d 50%, #020204 100%);
        }

        .ophf-coverArea {
            position: fixed;
            inset: 0 0 auto 0;
            z-index: 20;
            height: var(--ophf-cover-area);
            overflow: hidden;
            border-bottom: 1px solid rgba(248, 248, 248, 0.1);
            background:
                linear-gradient(180deg, rgba(2, 2, 4, 0.96), rgba(2, 2, 4, 0.72)),
                radial-gradient(circle at 50% 20%, rgba(99, 81, 180, 0.28), transparent 45%);
        }

        .ophf-coverArea::after {
            content: "";
            position: absolute;
            inset: auto 0 0 0;
            height: 42%;
            background: linear-gradient(180deg, transparent, rgba(2, 2, 4, 0.94));
            pointer-events: none;
        }

        .ophf-navbar {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: var(--ophf-topbar-h);
            padding: 0 clamp(12px, 4vw, 32px);
        }

        .ophf-wordmark {
            display: inline-flex;
            align-items: baseline;
            gap: 0.04em;
            font-family: Poppins, Inter, system-ui, sans-serif;
            text-transform: none;
            line-height: 0.9;
            color: var(--ophf-light);
            text-shadow: 0 0 22px rgba(107, 149, 220, 0.6);
        }

        .ophf-wordmarkOpa {
            font-weight: 900;
            font-size: clamp(25px, 7.8vw, 39px);
            letter-spacing: -0.06em;
        }

        .ophf-wordmarkHiFi {
            margin-left: 0.08em;
            font-weight: 600;
            font-size: clamp(22px, 6.7vw, 34px);
            letter-spacing: -0.01em;
        }

        .ophf-menuBtn {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 999px;
            background: rgba(248, 248, 248, 0.08);
            box-shadow: inset 0 0 0 1px rgba(248, 248, 248, 0.14);
        }

        .ophf-menuGlyph,
        .ophf-menuGlyph::before,
        .ophf-menuGlyph::after {
            display: block;
            width: 18px;
            height: 2px;
            border-radius: 99px;
            background: var(--ophf-light);
        }

        .ophf-menuGlyph {
            position: relative;
        }

        .ophf-menuGlyph::before,
        .ophf-menuGlyph::after {
            content: "";
            position: absolute;
            left: 0;
        }

        .ophf-menuGlyph::before {
            top: -6px;
        }

        .ophf-menuGlyph::after {
            top: 6px;
        }

        .ophf-coverSlot {
            position: absolute;
            inset: var(--ophf-topbar-h) 0 0 0;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-coverSlot {
            place-items: end center;
        }

        .ophf-coverImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 58%;
            opacity: 0.78;
            filter: saturate(1.12) contrast(1.04);
            transform: scale(1.02);
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-coverImg {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: min(100%, 460px);
            max-width: none;
            height: calc(100% * 1.53846);
            object-fit: fill;
            object-position: center bottom;
            opacity: 0.9;
            filter: blur(22px) saturate(1.08) contrast(1.02);
            transform: translateX(-50%) scale(1.08);
        }

        .ophf-coverTitle {
            position: absolute;
            z-index: 3;
            left: clamp(12px, 4vw, 32px);
            right: clamp(12px, 4vw, 32px);
            bottom: 10px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            pointer-events: none;
        }

        .ophf-coverKicker {
            margin: 0 0 3px;
            font-family: Oswald, sans-serif;
            font-size: 11px;
            letter-spacing: 0.16em;
            color: var(--ophf-lavender);
            text-transform: uppercase;
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-coverKicker {
            color: var(--ophf-purple);
        }

        .ophf-coverName {
            margin: 0;
            max-width: 74vw;
            font-family: Oswald, sans-serif;
            font-size: clamp(18px, 5vw, 34px);
            line-height: 0.92;
            text-transform: uppercase;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.9);
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-coverName {
            max-width: 100%;
            font-size: clamp(28px, 9.2vw, 64px);
            line-height: 0.82;
        }

        .ophf-coverNameLine {
            display: block;
        }

        .ophf-diveBtn {
            display: none;
            flex: 0 0 auto;
            min-height: 40px;
            padding: 0 16px;
            border-radius: 999px;
            background:
                radial-gradient(circle at 20% 0%, rgba(195, 77, 172, 0.72), transparent 42%),
                linear-gradient(135deg, rgba(37, 78, 181, 0.88), rgba(119, 13, 31, 0.8));
            box-shadow: inset 0 0 0 1px rgba(248, 248, 248, 0.16);
            color: var(--ophf-light);
            font-family: Oswald, sans-serif;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            pointer-events: auto;
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-diveBtn {
            display: inline-grid;
            place-items: center;
        }

        .ophf-main {
            position: fixed;
            top: var(--ophf-cover-area);
            right: 0;
            left: 0;
            height: var(--ophf-main-h);
            z-index: 5;
            min-height: 0;
            overflow: hidden;
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-main {
            height: var(--ophf-main-h-detail);
        }

        .ophf-screen {
            width: 100%;
            height: 100%;
            min-height: 0;
            display: none;
        }

        .ophf-app[data-ophf-mode="gallery"] .ophf-galleryScreen,
        .ophf-app[data-ophf-mode="videos"] .ophf-videosScreen,
        .ophf-app[data-ophf-mode="detail"] .ophf-detailScreen {
            display: block;
        }

        .ophf-galleryScreen {
            overflow: hidden;
            padding: var(--ophf-gallery-pad);
        }

        .ophf-galleryPanel {
            height: var(--ophf-gallery-panel-h);
            min-height: 0;
            display: grid;
            grid-template-rows: var(--ophf-promo-band-h) minmax(0, 1fr);
            gap: var(--ophf-gallery-gap);
        }

        .ophf-promoBand {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--ophf-gallery-gap);
            height: var(--ophf-promo-band-h);
            min-height: var(--ophf-promo-band-h);
        }

        .ophf-promoTile {
            position: relative;
            min-width: 0;
            overflow: hidden;
            border-radius: var(--ophf-radius-md);
            padding: clamp(10px, 3vw, 16px);
            background:
                linear-gradient(145deg, rgba(248, 248, 248, 0.12), rgba(248, 248, 248, 0.035)),
                radial-gradient(circle at 15% 0%, rgba(228, 66, 97, 0.35), transparent 46%),
                rgba(37, 18, 61, 0.66);
            box-shadow:
                inset 0 0 0 1px rgba(248, 248, 248, 0.12),
                0 12px 30px rgba(0, 0, 0, 0.22);
            text-align: left;
        }

        .ophf-promoTile::after {
            content: "";
            position: absolute;
            inset: auto -16px -24px auto;
            width: 78px;
            height: 78px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(107, 149, 220, 0.48), transparent 68%);
            pointer-events: none;
        }

        .ophf-promoTileLatest {
            overflow: hidden;
        }

        .ophf-promoTileLatest .ophf-promoEyebrow,
        .ophf-promoTileLatest .ophf-promoTitle {
            position: relative;
            z-index: 2;
        }

        .ophf-promoLatestArt {
            position: absolute;
            right: -10%;
            bottom: -12%;
            z-index: 3;
            width: clamp(74px, 18vw, 96px);
            aspect-ratio: 1 / 1;
            display: block;
            overflow: hidden;
            border-radius: 999px;
            background: #fff;
            box-shadow:
                0 0 0 2px rgba(248, 248, 248, 0.92),
                0 12px 22px rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }

        .ophf-promoLatestArt img {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: var(--ophf-node-art-h);
            object-fit: cover;
            object-position: center bottom;
            display: block;
        }

        .ophf-promoTilePlay {
            overflow: hidden;
            background:
                linear-gradient(145deg, rgba(248, 248, 248, 0.12), rgba(248, 248, 248, 0.035)),
                radial-gradient(circle at 80% 10%, rgba(37, 78, 181, 0.45), transparent 48%),
                rgba(24, 36, 117, 0.55);
        }

        .ophf-promoTilePlay .ophf-promoEyebrow,
        .ophf-promoTilePlay .ophf-promoTitle {
            position: relative;
            z-index: 2;
        }

        .ophf-promoPlaylistBtn {
            position: absolute;
            right: -10%;
            bottom: -10%;
            z-index: 3;
            width: clamp(72px, 18vw, 92px);
            height: auto;
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.28));
        }

        .ophf-promoEyebrow {
            display: block;
            margin-bottom: 7px;
            font-family: Oswald, sans-serif;
            font-size: clamp(10px, 2.9vw, 13px);
            letter-spacing: 0.13em;
            text-transform: uppercase;
            color: var(--ophf-lavender);
        }

        .ophf-promoTitle {
            display: block;
            max-width: 13ch;
            font-family: Oswald, sans-serif;
            font-size: clamp(19px, 5.2vw, 30px);
            line-height: 0.92;
            text-transform: uppercase;
            color: var(--ophf-light);
        }

        .ophf-fieldStage {
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .ophf-songField {
            position: relative;
            height: min(100%, calc(100vw - clamp(20px, 5vw, 48px)));
            max-width: min(680px, calc(100vw - clamp(20px, 5vw, 48px)));
            aspect-ratio: 1 / 1;
            border-radius: clamp(18px, 5vw, 34px);
            overflow: hidden;
            background:
                linear-gradient(rgba(248, 248, 248, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(248, 248, 248, 0.045) 1px, transparent 1px),
                radial-gradient(circle at center, rgba(99, 81, 180, 0.22), transparent 58%),
                rgba(2, 2, 4, 0.28);
            background-size: 33.333% 33.333%, 33.333% 33.333%, 100% 100%, 100% 100%;
            box-shadow:
                inset 0 0 0 1px rgba(248, 248, 248, 0.09),
                0 24px 70px rgba(0, 0, 0, 0.25);
        }

        .ophf-spiralSvg {
            position: absolute;
            inset: 0;
            z-index: 1;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
        }

        .ophf-spiralGlow {
            fill: none;
            stroke: rgba(195, 77, 172, 0.45);
            stroke-width: clamp(10px, 1.3vw, 18px);
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: blur(3px);
        }

        .ophf-spiralLine {
            fill: none;
            stroke: url(#ophfSpiralGradient);
            stroke-width: clamp(4px, 0.65vw, 8px);
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ophf-mapGrid {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-template-rows: repeat(3, minmax(0, 1fr));
            width: 100%;
            height: 100%;
        }

        .ophf-mapCell {
            position: relative;
            min-width: 0;
            min-height: 0;
            container-type: size;
            --ophf-node-title-h: clamp(20px, 21cqh, 28px);
            --ophf-node-title-font-size: clamp(11px, 7cqh, 19px);
            --ophf-node-edge-pad: clamp(4px, 2.4cqh, 7px);
            --ophf-node-max: 82px;
            --ophf-node: clamp(34px,
                    calc(min(100cqw, 100cqh) - var(--ophf-node-edge-pad) - var(--ophf-node-edge-pad)),
                    var(--ophf-node-max));
        }

        @media (min-width: 760px) {
            .ophf-mapCell {
                --ophf-node-max: 106px;
            }
        }

        .ophf-songUnit {
            position: absolute;
            left: 50%;
            top: 50%;
            width: var(--ophf-node);
            height: var(--ophf-node);
            transform: translate(-50%, -50%);
        }

        .ophf-songNode {
            position: absolute;
            top: 0;
            left: 50%;
            width: var(--ophf-node);
            height: var(--ophf-node);
            border-radius: 24%;
            transform: translateX(-50%);
            overflow: hidden;
            background: #fff;
            box-shadow:
                0 0 0 2px rgba(248, 248, 248, 0.9),
                0 0 0 5px rgba(2, 2, 4, 0.62),
                0 0 28px rgba(107, 149, 220, 0.36);
            transition: transform var(--ophf-ease), box-shadow var(--ophf-ease);
        }

        .ophf-songNode:active {
            transform: translateX(-50%) scale(0.95);
        }

        .ophf-songNodeTitle {
            position: absolute;
            top: 3px;
            left: 0;
            right: 0;
            z-index: 3;
            height: var(--ophf-node-title-h);
            padding: 2px 4px 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            overflow: hidden;
            background: #fff;
            color: var(--ophf-black);
            font-family: Oswald, sans-serif;
            font-size: var(--ophf-node-title-font-size);
            font-weight: 700;
            letter-spacing: -0.035em;
            line-height: 0.9;
            text-align: center;
            text-transform: uppercase;
            pointer-events: none;
        }

        .ophf-songNodeTitleLine {
            display: block;
            max-width: 100%;
            white-space: nowrap;
        }

        .ophf-nodeArtCrop {
            position: absolute;
            inset: 0;
            display: block;
            border-radius: inherit;
            overflow: hidden;
            background: var(--ophf-black);
        }

        .ophf-songNode .ophf-nodeArtCrop {
            inset: var(--ophf-node-title-h) 0 0;
            border-radius: 0;
            background: #fff;
        }

        .ophf-songNodeImg {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: var(--ophf-node-art-h);
            object-fit: cover;
            object-position: center bottom;
            display: block;
        }

        .ophf-songNodeFallback {
            position: absolute;
            inset: 0;
            display: block;
            background:
                radial-gradient(circle at 30% 22%, var(--ophf-pink), transparent 38%),
                radial-gradient(circle at 68% 72%, var(--ophf-blue), transparent 42%),
                linear-gradient(135deg, var(--ophf-purple), var(--ophf-black));
        }

        .ophf-videosScreen {
            overflow: hidden;
            padding: var(--ophf-gallery-pad);
        }

        .ophf-videosPanel {
            height: var(--ophf-gallery-panel-h);
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ophf-videoGrid {
            --ophf-video-gap: 14px;
            --ophf-video-shell-w: 920px;
            --ophf-video-shell-h: 460px;
            width: min(100%, 1080px);
            height: 100%;
            display: grid;
            place-items: center;
        }

        .ophf-videoShell {
            width: min(100%, var(--ophf-video-shell-w));
            height: min(100%, var(--ophf-video-shell-h));
            min-height: 0;
            display: block;
        }

        .ophf-videoRail {
            width: 100%;
            height: 100%;
            display: flex;
            gap: var(--ophf-video-gap);
            align-items: stretch;
        }

        .ophf-videoCard {
            --ophf-video-flex: 1;
            --ophf-video-fg-width: clamp(126px, 19vw, 196px);
            --ophf-video-fg-offset-x: 0px;
            position: relative;
            flex: var(--ophf-video-flex) 1 0;
            display: block;
            min-height: 0;
            padding: 0;
            border: 0;
            border-radius: 28px;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(248, 248, 248, 0.06), rgba(248, 248, 248, 0.02)),
                rgba(17, 18, 35, 0.72);
            color: var(--ophf-light);
            isolation: isolate;
            box-shadow:
                inset 0 0 0 1px rgba(248, 248, 248, 0.08),
                0 18px 34px rgba(0, 0, 0, 0.18);
            transition: flex 220ms ease, transform 180ms ease, filter 180ms ease, box-shadow 180ms ease;
            cursor: pointer;
        }

        .ophf-videoCard + .ophf-videoCard {
            margin-top: 0;
        }

        .ophf-videoCard:hover,
        .ophf-videoCard:focus-visible {
            filter: brightness(1.04);
            transform: translateY(-1px);
        }

        .ophf-videoCard[aria-pressed="true"] {
            box-shadow:
                inset 0 0 0 1px rgba(166, 188, 255, 0.46),
                0 20px 44px rgba(72, 100, 202, 0.18);
        }

        .ophf-videoCard--meet {
            --ophf-video-fg-offset-x: 8px;
        }

        .ophf-videoScene {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .ophf-videoThumb {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
            will-change: transform;
        }

        .ophf-videoThumb--bg {
            object-fit: cover;
            object-position: center center;
            transform: scale(1.04);
            filter: saturate(0.98) contrast(1.03);
        }

        .ophf-videoThumb--fg {
            inset: auto auto 10px 50%;
            width: var(--ophf-video-fg-width);
            height: auto;
            margin-left: calc((var(--ophf-video-fg-width) * -0.5) + var(--ophf-video-fg-offset-x));
            aspect-ratio: 1 / 1;
            object-fit: contain;
            object-position: center bottom;
            transform: scale(1);
        }

        .ophf-videoTitle {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 18px;
            z-index: 2;
            color: var(--ophf-light);
            font-family: Oswald, sans-serif;
            font-size: clamp(18px, 1.8vw, 24px);
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 0.9;
            text-align: left;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .ophf-videoCloseBtn {

                height: 34px;

        .ophf-trackPanel,

            width: 28px;
            height: 28px;
            border-radius: 999px;

            flex: 0 1 auto;

        .ophf-listenStrip {

            gap: var(--ophf-listen-gap);
        }

        .ophf-listenBtn,
        .ophf-shareBtn,
        .ophf-bottomBtn {
            display: grid;
            place-items: center;
            width: 100%;
            max-width: 148px;
            min-height: 38px;
            border-radius: 999px;
            background: rgba(248, 248, 248, 0.1);
            box-shadow: inset 0 0 0 1px rgba(248, 248, 248, 0.13);

            font-family: Oswald, sans-serif;
            font-size: 12px;
            letter-spacing: 0.09em;

        .ophf-listenBtn,
        .ophf-shareBtn {

            max-width: var(--ophf-listen-btn-size);
            min-height: var(--ophf-listen-btn-size);

            padding: 0;

        .ophf-listenIcon {
            width: var(--ophf-listen-icon-size);
            height: var(--ophf-listen-icon-size);
            display: block;
            object-fit: contain;
        }

        .ophf-shareBtn {
            background: var(--ophf-light);
            box-shadow:
                inset 0 0 0 1px rgba(2, 2, 4, 0.14),
                0 8px 18px rgba(0, 0, 0, 0.18);
            color: var(--ophf-purple);
        }

        .ophf-shareBtn .ophf-listenIcon {
            width: var(--ophf-listen-icon-size);
            height: var(--ophf-listen-icon-size);
        }

        @media (min-width: 501px) {
            .ophf-trackCover {
                grid-row: 1 / span 2;
            }

            .ophf-trackActions {
                grid-column: 2;
                grid-row: 2;
                justify-content: space-between;
                width: 100%;
                max-width: 100%;
            }
        }

        .ophf-detailBlock {
            padding: clamp(14px, 4vw, 22px);
        }

        .ophf-detailBlockLyrics {
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .ophf-detailHeading {
            margin: 0 0 10px;
            font-family: Oswald, sans-serif;
            font-size: 20px;
            line-height: 1;
            letter-spacing: 0.08em;

            min-height: 0;
            overflow-y: auto;

        .ophf-notes {
            margin: 12px 0 0;
            color: rgba(248, 248, 248, 0.68);
            font-size: 14px;
            line-height: 1.45;
        }

        .ophf-miniRail {
            position: fixed;
            right: 0;
            bottom: var(--ophf-nav-h);
            left: 0;
            z-index: 15;
            height: var(--ophf-rail-h);
            display: none;
            align-items: center;
            gap: 5px;
            overflow-x: auto;
            overflow-y: visible;
            overscroll-behavior-x: contain;
            padding: 18px 0 8px;
            background: rgba(2, 2, 4, 0.82);
            border-top: 1px solid rgba(248, 248, 248, 0.1);
            scrollbar-width: none;
        }

        .ophf-miniRail::-webkit-scrollbar {
            display: none;
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-miniRail {
            display: flex;
        }

        .ophf-railBtn {
            position: relative;
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(248, 248, 248, 0.08);
            box-shadow: 0 0 0 1px rgba(248, 248, 248, 0.16);
            transition: transform var(--ophf-ease), box-shadow var(--ophf-ease);
        }

        .ophf-railBtn[aria-current="true"] {
            z-index: 2;
            transform: translateY(-10px) scale(1.14);
            box-shadow:
                0 0 0 2px var(--ophf-light),

                0 0 22px rgba(195, 77, 172, 0.72);
        }

        .ophf-railImg {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: var(--ophf-node-art-h);
            object-fit: cover;
            object-position: center bottom;
            display: block;
        }

        .ophf-bottomNav {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 30;
            display: grid;
            grid-template-columns: repeat(3, var(--ophf-nav-button-w));
            justify-content: center;
            height: var(--ophf-nav-h);
            padding: var(--ophf-nav-pad-top) clamp(8px, 3vw, 18px) var(--ophf-nav-pad-bottom);
            gap: var(--ophf-nav-gap);
            background: rgba(2, 2, 4, 0.94);
            border-top: 1px solid rgba(248, 248, 248, 0.1);
        }

        .ophf-bottomBtn {
            min-height: var(--ophf-nav-button-h);
            background: rgba(248, 248, 248, 0.055);
            color: rgba(248, 248, 248, 0.78);
            box-shadow:
                inset 0 0 0 1px rgba(248, 248, 248, 0.1),
                0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform var(--ophf-ease), box-shadow var(--ophf-ease), background var(--ophf-ease), color var(--ophf-ease);
        }

        .ophf-app[data-ophf-mode="gallery"] .ophf-bottomBtn[data-ophf-nav-b],
        .ophf-bottomBtnActive {
            background:
                linear-gradient(180deg, rgba(107, 149, 220, 0.52), rgba(99, 81, 180, 0.42)),
                rgba(37, 78, 181, 0.72);
            color: var(--ophf-light);
            transform: translateY(1px);
            box-shadow:
                inset 0 0 0 1px rgba(248, 248, 248, 0.42),
                inset 0 1px 0 rgba(255, 255, 255, 0.24),
                0 0 22px rgba(107, 149, 220, 0.5);
        }

        @media (min-width: 760px) {
            :root {
                --ophf-cover-area: 24dvh;
                --ophf-promo-band-h: 84px;
            }

            .ophf-songField {
                width: 100%;
                height: min(100%, var(--ophf-gallery-map-max-h), var(--ophf-gallery-map-max-w));
                max-width: none;
                aspect-ratio: 1 / 1;
            }

            .ophf-promoBand,
            .ophf-detailScroller {
                width: min(var(--ophf-promo-content-max), 100%);
                margin-inline: auto;
            }

            .ophf-fieldStage {
                width: min(var(--ophf-gallery-map-max-w), 100%);
                margin-inline: auto;
            }
        }
    </style>
</head>

<body>
    <div class="ophf-app" data-ophf-mode="gallery">
        <header class="ophf-coverArea">
            <nav class="ophf-navbar" aria-label="Main navigation">
                <div class="ophf-wordmark" aria-label="OPAHiFi">
                    <span class="ophf-wordmarkOpa">opa</span><span class="ophf-wordmarkHiFi">HiFi</span>
                </div>
                <button class="ophf-menuBtn" type="button" aria-label="Open menu">
                    <span class="ophf-menuGlyph" aria-hidden="true"></span>
                </button>
            </nav>

            <div class="ophf-coverSlot">
                <img class="ophf-coverImg" data-ophf-cover-img src="/img/opa/cover.png" alt="" />
            </div>

            <div class="ophf-coverTitle">
                <div>
                    <p class="ophf-coverKicker" data-ophf-cover-kicker>Gallery Map</p>
                    <h1 class="ophf-coverName" data-ophf-cover-name>OpaHiFi Journey</h1>
                </div>
                <button class="ophf-diveBtn" type="button">Dive In &gt;</button>
            </div>
        </header>

        <main class="ophf-main">
            <section class="ophf-screen ophf-galleryScreen" aria-label="Gallery map">
                <div class="ophf-galleryPanel">
                    <div class="ophf-promoBand">
                        <button class="ophf-promoTile ophf-promoTileLatest" type="button" data-ophf-latest>
                            <span class="ophf-promoEyebrow">Latest Release</span>
                            <span class="ophf-promoTitle">Wellwolf</span>
                            <span class="ophf-promoLatestArt" aria-hidden="true">
                                <img src="img/music/base/base-wellwolfhowllehluya.png" alt="">
                            </span>
                        </button>
                        <button class="ophf-promoTile ophf-promoTilePlay" type="button" data-ophf-playall>
                            <span class="ophf-promoEyebrow">Playlist Order</span>
                            <span class="ophf-promoTitle">Play All</span>
                            <img class="ophf-promoPlaylistBtn" src="img/btns/playlist.png" alt="" aria-hidden="true">

                    <div class="ophf-fieldStage">

                                        <stop offset="0.46" stop-color="#C34DAC" />
                                        <stop offset="1" stop-color="#DC3612" />
                                    </linearGradient>
                                </defs>
                                <path class="ophf-spiralGlow" data-ophf-spiral-glow
                                    d="M .5 .5 L 1.5 .5 L 2.5 .5 L 2.5 1.5 L 2.5 2.5 L 1.5 2.5 L .5 2.5 L .5 1.5 L 1.5 1.5" />
                                <path class="ophf-spiralLine" data-ophf-spiral-line
                                    d="M .5 .5 L 1.5 .5 L 2.5 .5 L 2.5 1.5 L 2.5 2.5 L 1.5 2.5 L .5 2.5 L .5 1.5 L 1.5 1.5" />
                            </svg>
                            <div class="ophf-mapGrid" data-ophf-map-grid></div>

                    </div>
                </div>
            </section>

            <section class="ophf-screen ophf-videosScreen" aria-label="Videos">
                <div class="ophf-videosPanel">

                </div>
            </section>

            <section class="ophf-screen ophf-detailScreen" aria-label="Version detail">
                <div class="ophf-detailScroller">
                    <article class="ophf-trackPanel">
                        <img class="ophf-trackCover" data-ophf-track-cover alt="" />
                        <div class="ophf-trackMeta">
                            <h2 class="ophf-trackTitle" data-ophf-track-title></h2>
                            <div class="ophf-versionMeta">
                                <p class="ophf-versionMetaText" data-ophf-version-meta></p>
                                <div class="ophf-versionNav" data-ophf-version-nav></div>

                            <p class="ophf-versionTitle" data-ophf-version-title></p>

                    <section class="ophf-detailBlock ophf-detailBlockLyrics">

            <button class="ophf-bottomBtn" type="button" data-ophf-nav-c>About</button>

    </div>

    <script>
        class OpaHifiVideosView {
            static cards = [
                {
                    id: "meet",
                    title: "MEET OPA!",
                    href: "https://www.youtube.com/playlist?list=PLtGnlTqdsNV02--EhJTxL1WJG7oAf1Fc9",
                    bgSrc: "img/opa/videos/opa-meet-bg.png",
                    fgSrc: "img/opa/videos/opa-meet.png",
                    className: "ophf-videoCard ophf-videoCard--meet"
                },
                {
                    id: "clips",
                    title: "VIDEO CLIPS",
                    href: "https://www.youtube.com/playlist?list=PLtGnlTqdsNV22pErYzaWpzQh1Ilcb266T",
                    bgSrc: "img/opa/videos/opa-video-bg.png",
                    fgSrc: "img/opa/videos/opa-video.png",
                    className: "ophf-videoCard"
                },
                {
                    id: "lyrics",
                    title: "LYRICS SHORTS",
                    href: "https://www.youtube.com/playlist?list=PLtGnlTqdsNV0mslgh_bWih69lDOORw7rA",
                    bgSrc: "img/opa/videos/opa-lyrics-bg.png",
                    fgSrc: "img/opa/videos/opa-lyrics.png",
                    className: "ophf-videoCard"
                }
            ];

            constructor(root) {
                this.root = root;
                this.cleanup = [];
                this.activeCardId = null;
                this.cardsById = new Map();
                this.playersById = new Map();
                this.shell = null;
                this.rail = null;
                this.layoutObserver = null;
                this.handleLayout = () => this.applyLayout();
            }

            render() {
                if (!this.root || this.root.childElementCount) return;

                this.shell = document.createElement("div");
                this.shell.className = "ophf-videoShell";

                this.rail = document.createElement("div");
                this.rail.className = "ophf-videoRail";
                this.shell.appendChild(this.rail);
                this.root.appendChild(this.shell);

                OpaHifiVideosView.cards.forEach((card) => {
                    const node = this.createCard(card);
                    this.cardsById.set(card.id, node);
                    this.rail.appendChild(node);
                });
            }

            activate() {
                this.render();
                this.bindPointerMotion();
                this.bindLayout();
                this.applyLayout();
            }

            deactivate() {
                this.resetPointerMotion();
                this.unbindLayout();
                this.clearSelection();
            }

            createCard(card) {
                const cardNode = document.createElement("article");
                cardNode.className = card.className;
                cardNode.dataset.ophfVideoId = card.id;
                cardNode.setAttribute("aria-label", `Open ${card.title}`);
                cardNode.setAttribute("aria-pressed", "false");
                cardNode.setAttribute("role", "button");
                cardNode.tabIndex = 0;
                cardNode.addEventListener("click", () => {
                    if (this.activeCardId === card.id) return;
                    this.selectCard(card.id);
                });
                cardNode.addEventListener("keydown", (event) => {
                    if (event.key !== "Enter" && event.key !== " ") return;
                    event.preventDefault();
                    if (this.activeCardId === card.id) return;
                    this.selectCard(card.id);
                });

                const scene = document.createElement("span");
                scene.className = "ophf-videoScene";
                scene.setAttribute("aria-hidden", "true");

                const bg = document.createElement("img");
                bg.className = "ophf-videoThumb ophf-videoThumb--bg";
                bg.src = card.bgSrc;
                bg.alt = "";
                bg.loading = "lazy";

                const fg = document.createElement("img");
                fg.className = "ophf-videoThumb ophf-videoThumb--fg";
                fg.src = card.fgSrc;
                fg.alt = "";
                fg.loading = "lazy";

                const title = document.createElement("span");
                title.className = "ophf-videoTitle";
                title.textContent = card.title;

                const activeBar = document.createElement("div");
                activeBar.className = "ophf-videoActiveBar";

                const activeMeta = document.createElement("div");
                activeMeta.className = "ophf-videoActiveMeta";

                const activeEyebrow = document.createElement("span");
                activeEyebrow.className = "ophf-videoActiveEyebrow";
                activeEyebrow.textContent = "Now Viewing";

                const activeTitle = document.createElement("span");
                activeTitle.className = "ophf-videoActiveTitle";
                activeTitle.textContent = card.title;

                const player = document.createElement("div");
                player.className = "ophf-videoPlayer";

                const iframe = document.createElement("iframe");
                iframe.className = "ophf-videoFrame";
                iframe.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share");
                iframe.setAttribute("allowfullscreen", "");
                iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
                iframe.title = `${card.title} player`;
                player.appendChild(iframe);
                this.playersById.set(card.id, iframe);

                const close = document.createElement("button");
                close.className = "ophf-videoCloseBtn";
                close.type = "button";
                close.textContent = "×";
                close.setAttribute("aria-label", `Close ${card.title}`);
                close.addEventListener("click", (event) => {
                    event.stopPropagation();
                    this.clearSelection();
                });

                const playButton = document.createElement("span");
                playButton.className = "ophf-videoPlayBtn";

                const play = document.createElement("span");
                play.className = "ophf-videoPlayIcon";

                activeMeta.appendChild(activeEyebrow);
                activeMeta.appendChild(activeTitle);
                activeBar.appendChild(activeMeta);
                activeBar.appendChild(close);
                playButton.appendChild(play);
                scene.appendChild(title);
                scene.appendChild(bg);
                scene.appendChild(fg);
                scene.appendChild(playButton);
                cardNode.appendChild(scene);
                cardNode.appendChild(activeBar);
                cardNode.appendChild(player);
                return cardNode;
            }

            selectCard(cardId) {
                const card = OpaHifiVideosView.cards.find((item) => item.id === cardId);
                if (!card || !this.root) return;

                this.activeCardId = card.id;
                this.root.classList.add("ophf-videoGrid--active");
                this.applyLayout();

                this.cardsById.forEach((node, id) => {
                    node.setAttribute("aria-pressed", id === card.id ? "true" : "false");
                });

                this.playersById.forEach((frame, id) => {
                    frame.src = id === card.id ? this.toEmbedSrc(card.href) : "";
                });
            }

            clearSelection() {
                this.activeCardId = null;
                if (this.root) this.root.classList.remove("ophf-videoGrid--active");
                this.applyLayout();
                this.cardsById.forEach((node) => {
                    node.setAttribute("aria-pressed", "false");
                });
                this.playersById.forEach((frame) => {
                    frame.src = "";
                });
            }

            toEmbedSrc(href) {
                try {
                    const url = new URL(href);
                    const playlistId = url.searchParams.get("list");
                    if (playlistId) {
                        return `https://www.youtube.com/embed/videoseries?list=${encodeURIComponent(playlistId)}&autoplay=1&playsinline=1&rel=0&controls=1&modestbranding=1`;
                    }
                } catch (_) {
                    return "";
                }
                return "";
            }

            bindPointerMotion() {
                if (!this.rail || this.cleanup.length) return;
                if (typeof window.matchMedia === "function" && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                    return;
                }

                this.rail.querySelectorAll(".ophf-videoCard").forEach((card, index) => {
                    const bg = card.querySelector(".ophf-videoThumb--bg");
                    const fg = card.querySelector(".ophf-videoThumb--fg");
                    if (!bg || !fg) return;

                    const baseBgX = index === 1 ? 1.6 : -1.6;
                    const moveCard = (ev) => {
                        const rect = card.getBoundingClientRect();
                        if (!rect.width || !rect.height) return;
                        const px = ((ev.clientX - rect.left) / rect.width) - 0.5;
                        const py = ((ev.clientY - rect.top) / rect.height) - 0.5;
                        bg.style.transform = `translate(${(baseBgX + (px * 8)).toFixed(2)}%, ${(py * 5).toFixed(2)}%) scale(1.1)`;
                        fg.style.transform = `translate(${(px * -4.5).toFixed(2)}%, ${(py * -2.2).toFixed(2)}%) scale(1.04)`;
                    };

                    const leaveCard = () => {
                        bg.style.transform = "";
                        fg.style.transform = "";
                    };

                    card.addEventListener("pointermove", moveCard);
                    card.addEventListener("pointerleave", leaveCard);
                    card.addEventListener("blur", leaveCard, true);
                    this.cleanup.push(() => {
                        card.removeEventListener("pointermove", moveCard);
                        card.removeEventListener("pointerleave", leaveCard);
                        card.removeEventListener("blur", leaveCard, true);
                    });
                });
            }

            bindLayout() {
                if (!this.root) return;
                if (!this.layoutObserver && "ResizeObserver" in window) {
                    this.layoutObserver = new ResizeObserver(this.handleLayout);
                    this.layoutObserver.observe(this.root);
                }
                window.addEventListener("resize", this.handleLayout);
            }

            unbindLayout() {
                if (this.layoutObserver) {
                    this.layoutObserver.disconnect();
                    this.layoutObserver = null;
                }
                window.removeEventListener("resize", this.handleLayout);
            }

            applyLayout() {
                if (!this.root) return;

                const width = this.root.clientWidth;
                const height = this.root.clientHeight;
                if (!width || !height) return;

                const isNarrow = width < 760;
                const gap = isNarrow ? 10 : 14;
                const shellW = Math.min(width, isNarrow ? 940 : 1020);
                const shellH = Math.min(height, Math.max(isNarrow ? 310 : 360, Math.min(isNarrow ? 430 : 540, Math.floor(shellW * (isNarrow ? 0.8 : 0.56)))));
                const activeFlex = isNarrow ? 1.78 : 2.1;
                const idleFlex = isNarrow ? 0.61 : 0.78;

                this.root.style.setProperty("--ophf-video-gap", `${gap}px`);
                this.root.style.setProperty("--ophf-video-shell-w", `${shellW}px`);
                this.root.style.setProperty("--ophf-video-shell-h", `${shellH}px`);

                this.cardsById.forEach((node, id) => {
                    const flex = this.activeCardId ? (id === this.activeCardId ? activeFlex : idleFlex) : 1;
                    node.style.setProperty("--ophf-video-flex", String(flex));
                });
            }

            resetPointerMotion() {
                this.cleanup.forEach((cleanup) => cleanup());
                this.cleanup = [];
                if (!this.rail) return;
                this.rail.querySelectorAll(".ophf-videoThumb--bg, .ophf-videoThumb--fg").forEach((node) => {
                    node.style.transform = "";
                });
            }
        }

        class OpaHifiGalleryRoute {
            isActive(state) {
                return state.mode === "gallery";
            }

            buildHash() {
                return "#gallery";
            }

            matches(route) {
                return !route || route === "gallery";
            }

            apply(app) {
                app.openGallery({ skipRoute: true });
            }
        }

        class OpaHifiVideosRoute {
            isActive(state) {
                return state.mode === "videos";
            }

            buildHash() {
                return "#videos";
            }

            matches(route) {
                return route === "videos";
            }

            apply(app) {
                app.openVideos({ skipRoute: true });
            }
        }

        class OpaHifiDetailRoute {
            isActive(state) {
                return state.mode === "detail";
            }

            buildHash(state) {
                return state.versionIndex > 0
                    ? `#${state.songId}/v${state.versionIndex + 1}`
                    : `#${state.songId}`;
            }

            matches(route, app) {
                const [songId] = route.split("/");
                return app.songs.some((song) => song.id === songId);
            }

            apply(app, route) {
                const [songId, versionToken] = route.split("/");
                const song = app.songs.find((item) => item.id === songId);
                if (!song) {
                    app.openGallery({ skipRoute: true });
                    return;
                }

                let versionIndex = 0;
                if (versionToken) {
                    const parsed = Number.parseInt(versionToken.replace(/^v/i, ""), 10);
                    if (Number.isFinite(parsed) && parsed > 0) {
                        versionIndex = Math.min(parsed - 1, song.versions.length - 1);
                    }
                }

                app.openSong(songId, versionIndex, { skipRoute: true });
            }
        }

                                Amazon: "https://music.amazon.com/tracks/B0GXHSFW83?marketplaceId=ATVPDKIKX0DER&musicTerritory=US&ref=dm_sh_YaZDAKqp0vQwgwM7y8yENc9Zw"
                            },
                            lyrics: "Wellwolf no bloodlust no fame thirst\nRun on love not to be first\nBite with kindness not to hurt\nBeat with heart not for sport.",
                            notes: "The kindness endpoint. The monster myth flips into care."
                        }
                    ]
                }
            ];
    
            static playlistOrder = [
                "opaparty",
                "wellwolf",
                "glittaa",
                "truthfairy",
                "fullmindness",
                "hallucinating",
                "splenda",
                "oldlove",
                "brunch"
            ];
    
            static platforms = ["Spotify", "Apple", "YouTube", "YouTube Music", "Amazon"];
            static platformIcons = {
                Spotify: "img/ico/spotify-white.svg",
                Apple: "img/ico/apple-white.svg",
                YouTube: "img/ico/youtube-white.svg",
                "YouTube Music": "img/ico/youtubemusic-white.svg",
                Amazon: "img/ico/amazon-white.svg"
            };
    

            constructor(options = {}) {
                this.basePath = options.basePath || this.constructor.basePath;
                this.heroCover = options.heroCover || this.constructor.heroCover;
                this.latestSongId = options.latestSongId || this.constructor.latestSongId;
                this.songs = options.songs || this.constructor.songs;
                this.playlistOrder = options.playlistOrder || this.constructor.playlistOrder;
                this.platforms = options.platforms || this.constructor.platforms;
                this.platformIcons = options.platformIcons || this.constructor.platformIcons;
                this.els = {
                    app: document.querySelector(".ophf-app"),
                    coverImg: document.querySelector("[data-ophf-cover-img]"),
                    coverKicker: document.querySelector("[data-ophf-cover-kicker]"),
                    coverName: document.querySelector("[data-ophf-cover-name]"),
                    coverPill: document.querySelector("[data-ophf-cover-pill]"),
                    songField: document.querySelector("[data-ophf-song-field]"),
                    mapGrid: document.querySelector("[data-ophf-map-grid]"),
                    spiralSvg: document.querySelector("[data-ophf-spiral-svg]"),
                    spiralGradient: document.querySelector("[data-ophf-spiral-gradient]"),
                    spiralGlow: document.querySelector("[data-ophf-spiral-glow]"),
                    spiralLine: document.querySelector("[data-ophf-spiral-line]"),
                    videoGrid: document.querySelector("[data-ophf-video-grid]"),
                    latest: document.querySelector("[data-ophf-latest]"),
                    playAll: document.querySelector("[data-ophf-playall]"),
                    trackCover: document.querySelector("[data-ophf-track-cover]"),
                    shareSlot: document.querySelector("[data-ophf-share]"),
                    trackTitle: document.querySelector("[data-ophf-track-title]"),
                    versionMeta: document.querySelector("[data-ophf-version-meta]"),
                    versionNav: document.querySelector("[data-ophf-version-nav]"),
                    versionTitle: document.querySelector("[data-ophf-version-title]"),
                    links: document.querySelector("[data-ophf-links]"),
                    lyrics: document.querySelector("[data-ophf-lyrics]"),
                    miniRail: document.querySelector("[data-ophf-mini-rail]"),
                    navA: document.querySelector("[data-ophf-nav-a]"),
                    navB: document.querySelector("[data-ophf-nav-b]"),
                    navC: document.querySelector("[data-ophf-nav-c]")
                };
                this.state = {
                    mode: "gallery",
                    songId: "wellwolf",
                    versionIndex: 0
                };
                this.lyricsCache = new Map();
                this.lyricsRequestId = 0;
                this.spiralFrame = 0;
                this.mapResizeObserver = null;
                this.ignoreNextHashChange = false;
                this.screenRoutes = [
                    new OpaHifiGalleryRoute(),
                    new OpaHifiVideosRoute(),
                    new OpaHifiDetailRoute()
                ];
                this.videosView = new OpaHifiVideosView(this.els.videoGrid);
                this.scheduleSpiralUpdate = this.scheduleSpiralUpdate.bind(this);
                this.handleHashChange = this.handleHashChange.bind(this);
            }

            coverUrl(song) {
            return `${this.basePath}${song.file}`;
        }

            versionImageUrl(song, version) {
            return version.image || this.coverUrl(song);
        }

            async loadLyrics(version) {
            const fallback = version.lyrics || "";
            if (!version.lyricsPath) return fallback;
            if (this.lyricsCache.has(version.lyricsPath)) return this.lyricsCache.get(version.lyricsPath);

            const response = await fetch(version.lyricsPath, { cache: "force-cache" });
            if (!response.ok) throw new Error(`Lyrics request failed: ${response.status}`);
            const text = await response.text();
            this.lyricsCache.set(version.lyricsPath, text);
            return text;
        }

            getSong(id) {
            return this.songs.find((song) => song.id === id) || this.songs[0];
        }

            getLatestSong() {
            return this.getSong(this.latestSongId);
        }

            setImageFallback(img, song) {
            img.onerror = () => {
                img.onerror = null;
                img.style.display = "none";
                if (img.parentElement && !img.parentElement.querySelector(".ophf-songNodeFallback")) {
                    const fallback = document.createElement("span");
                    fallback.className = "ophf-songNodeFallback";
                    img.parentElement.appendChild(fallback);
                }
            };
        }

            getSongLabelLines(song) {
            return song.labelLines && song.labelLines.length ? song.labelLines : [song.title];
        }

            setCoverTitle(lines) {
            this.els.coverName.innerHTML = "";
            lines.forEach((line) => {
                const lineEl = document.createElement("span");
                lineEl.className = "ophf-coverNameLine";
                lineEl.textContent = line;
                this.els.coverName.appendChild(lineEl);
            });
        }

            createIconImg(src) {
            const icon = document.createElement("img");
            icon.className = "ophf-listenIcon";
            icon.src = src;
            icon.alt = "";
            return icon;
        }

            createShareIcon() {
            const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            icon.setAttribute("class", "ophf-listenIcon");
            icon.setAttribute("viewBox", "0 0 24 24");
            icon.setAttribute("aria-hidden", "true");

            const lineA = document.createElementNS("http://www.w3.org/2000/svg", "path");
            lineA.setAttribute("d", "M8.7 10.7 15.3 7.2");
            const lineB = document.createElementNS("http://www.w3.org/2000/svg", "path");
            lineB.setAttribute("d", "M8.7 13.3 15.3 16.8");
            [lineA, lineB].forEach((line) => {
                line.setAttribute("fill", "none");
                line.setAttribute("stroke", "currentColor");
                line.setAttribute("stroke-width", "2.3");
                line.setAttribute("stroke-linecap", "round");
                icon.appendChild(line);
            });

            [
                [6.5, 12],
                [17.5, 6],
                [17.5, 18]
            ].forEach(([cx, cy]) => {
                const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                dot.setAttribute("cx", cx);
                dot.setAttribute("cy", cy);
                dot.setAttribute("r", "2.8");
                dot.setAttribute("fill", "currentColor");
                icon.appendChild(dot);
            });

            return icon;
        }

            versionMixBackground(version) {
            const colors = Array.isArray(version.mixColors) ? version.mixColors.filter(Boolean) : [];
            if (!colors.length) return "#ffffff";
            if (colors.length === 1) return colors[0];
            return `linear-gradient(135deg, ${colors.join(", ")})`;
        }

            createVersionJump(direction, targetVersion, targetIndex) {
            const btn = document.createElement("button");
            btn.className = "ophf-versionJump";
            btn.type = "button";
            btn.setAttribute("aria-label", `${direction < 0 ? "Previous" : "Next"} version`);
            btn.addEventListener("click", () => this.openSong(this.state.songId, targetIndex));

            const glyph = document.createElement("span");
            glyph.className = "ophf-versionJumpGlyph";
            glyph.textContent = direction < 0 ? "<" : ">";

            const swatch = document.createElement("span");
            swatch.className = "ophf-versionJumpSwatch";
            swatch.style.background = this.versionMixBackground(targetVersion);
            swatch.appendChild(glyph);

            btn.appendChild(swatch);
            return btn;
        }

            renderMap() {
            this.els.mapGrid.innerHTML = "";

            this.songs
                .slice()
                .sort((a, b) => a.journey - b.journey)
                .forEach((song) => {
                    const cell = document.createElement("div");
                    cell.className = "ophf-mapCell";
                    cell.dataset.ophfSongId = song.id;
                    cell.style.gridRow = song.grid[0];
                    cell.style.gridColumn = song.grid[1];

                    const node = document.createElement("button");
                    node.className = "ophf-songNode";
                    node.type = "button";
                    node.setAttribute("aria-label", `Open ${song.title}`);
                    node.addEventListener("click", () => this.openSong(song.id));

                    const img = document.createElement("img");
                    img.className = "ophf-songNodeImg";
                    img.src = this.coverUrl(song);
                    img.alt = "";
                    this.setImageFallback(img, song);

                    const title = document.createElement("span");
                    title.className = "ophf-songNodeTitle";
                    (song.labelLines || [song.title]).forEach((line) => {
                        const lineEl = document.createElement("span");
                        lineEl.className = "ophf-songNodeTitleLine";
                        lineEl.textContent = line;
                        title.appendChild(lineEl);
                    });

                    const crop = document.createElement("span");
                    crop.className = "ophf-nodeArtCrop";
                    crop.appendChild(img);

                    node.appendChild(title);
                    node.appendChild(crop);
                    const unit = document.createElement("div");
                    unit.className = "ophf-songUnit";

                    unit.appendChild(node);
                    cell.appendChild(unit);
                    this.els.mapGrid.appendChild(cell);
                });

            this.scheduleSpiralUpdate();
        }

            scheduleSpiralUpdate() {
            if (this.spiralFrame) return;
            this.spiralFrame = requestAnimationFrame(() => {
                this.spiralFrame = 0;
                this.updateSpiral();
            });
        }

            updateSpiral() {
            if (!this.els.songField || !this.els.spiralSvg || !this.els.spiralLine || !this.els.spiralGlow) return;

            const fieldRect = this.els.songField.getBoundingClientRect();
            if (!fieldRect.width || !fieldRect.height) return;

            const ordered = this.songs.slice().sort((a, b) => a.journey - b.journey);
            const points = ordered
                .map((song) => {
                    const cell = this.els.mapGrid.querySelector(`[data-ophf-song-id="${song.id}"]`);
                    const node = cell ? cell.querySelector(".ophf-songNode") : null;
                    if (!node) return null;

                    const nodeRect = node.getBoundingClientRect();
                    return {
                        x: nodeRect.left - fieldRect.left + nodeRect.width / 2,
                        y: nodeRect.top - fieldRect.top + nodeRect.height / 2
                    };
                })
                .filter(Boolean);

            if (points.length < 2) return;

            const d = points
                .map((point, index) => `${index === 0 ? "M" : "L"} ${point.x.toFixed(2)} ${point.y.toFixed(2)}`)
                .join(" ");
            const width = fieldRect.width.toFixed(2);
            const height = fieldRect.height.toFixed(2);
            const first = points[0];
            const last = points[points.length - 1];

            this.els.spiralSvg.setAttribute("viewBox", `0 0 ${width} ${height}`);
            this.els.spiralGlow.setAttribute("d", d);
            this.els.spiralLine.setAttribute("d", d);

            if (this.els.spiralGradient) {
                this.els.spiralGradient.setAttribute("x1", first.x.toFixed(2));
                this.els.spiralGradient.setAttribute("y1", first.y.toFixed(2));
                this.els.spiralGradient.setAttribute("x2", last.x.toFixed(2));
                this.els.spiralGradient.setAttribute("y2", last.y.toFixed(2));
            }
        }

            renderRail() {
            this.els.miniRail.innerHTML = "";

            this.songs
                .slice()
                .sort((a, b) => a.journey - b.journey)
                .forEach((song) => {
                    const btn = document.createElement("button");
                    btn.className = "ophf-railBtn";
                    btn.type = "button";
                    btn.setAttribute("aria-label", song.title);
                    btn.setAttribute("aria-current", song.id === this.state.songId ? "true" : "false");
                    btn.addEventListener("click", () => this.openSong(song.id));

                    const img = document.createElement("img");
                    img.className = "ophf-railImg";
                    img.src = this.coverUrl(song);
                    img.alt = "";
                    this.setImageFallback(img, song);

                    const crop = document.createElement("span");
                    crop.className = "ophf-nodeArtCrop";
                    crop.appendChild(img);

                    btn.appendChild(crop);
                    this.els.miniRail.appendChild(btn);
                });
        }

            renderLinks(version) {
            this.els.links.innerHTML = "";

            const strip = document.createElement("div");
            strip.className = "ophf-listenStrip";

            this.platforms.forEach((name) => {
                const a = document.createElement("a");
                a.className = "ophf-listenBtn";
                a.href = version.links[name] || "#";
                a.setAttribute("aria-label", `${name} link`);
                a.appendChild(this.createIconImg(this.platformIcons[name]));
                strip.appendChild(a);
            });

            this.els.links.appendChild(strip);
        }

            async renderDetail() {
            const song = this.getSong(this.state.songId);
            const version = song.versions[this.state.versionIndex] || song.versions[0];
            const requestId = ++this.lyricsRequestId;

            this.els.trackCover.src = this.versionImageUrl(song, version);
            this.els.trackCover.alt = `${song.title} cover`;
            this.els.trackTitle.textContent = "";
            this.els.versionTitle.textContent = version.title;
            this.els.lyrics.textContent = "Loading lyrics...";

            if (song.versions.length <= 1) {
                this.els.versionMeta.textContent = "Opa & Only version";
            } else {
                this.els.versionMeta.textContent = `Version ${this.state.versionIndex + 1}/${song.versions.length}`;
            }

            this.els.versionNav.innerHTML = "";
            if (song.versions.length > 1) {
                if (this.state.versionIndex > 0) {
                    this.els.versionNav.appendChild(
                        this.createVersionJump(-1, song.versions[this.state.versionIndex - 1], this.state.versionIndex - 1)
                    );
                }
                if (this.state.versionIndex < song.versions.length - 1) {
                    this.els.versionNav.appendChild(
                        this.createVersionJump(1, song.versions[this.state.versionIndex + 1], this.state.versionIndex + 1)
                    );
                }
            }

            this.els.shareSlot.innerHTML = "";
            const share = document.createElement("button");
            share.className = "ophf-shareBtn";
            share.type = "button";
            share.setAttribute("aria-label", "Share");
            share.appendChild(this.createShareIcon());
            share.addEventListener("click", () => this.shareCurrent());
            this.els.shareSlot.appendChild(share);

            this.renderLinks(version);
            this.renderRail();
            this.renderCover(song);

            try {
                const lyrics = await this.loadLyrics(version);
                if (requestId === this.lyricsRequestId) {
                    this.els.lyrics.textContent = lyrics || version.lyrics || "";
                }
            } catch {
                if (requestId === this.lyricsRequestId) {
                    this.els.lyrics.textContent = version.lyrics || "";
                }
            }
        }

            renderCover(song = null) {
            if (this.state.mode === "gallery") {
                this.els.coverImg.src = this.heroCover;
                this.els.coverImg.style.display = "block";
                this.els.coverKicker.textContent = "Gallery Map";
                this.setCoverTitle(["OPAHiFi Journey"]);
                if (this.els.coverPill) this.els.coverPill.textContent = "3x3 Map";
                return;
            }

            if (this.state.mode === "videos") {
                this.els.coverImg.src = this.heroCover;
                this.els.coverImg.style.display = "block";
                this.els.coverKicker.textContent = "Video Vault";
                this.setCoverTitle(["Three Opa", "Channels"]);
                if (this.els.coverPill) this.els.coverPill.textContent = "Playlists";
                return;
            }

            const activeSong = song || this.getSong(this.state.songId);
            this.els.coverImg.src = this.coverUrl(activeSong);
            this.els.coverImg.style.display = "block";
            this.els.coverKicker.textContent = "Now Viewing";
            this.setCoverTitle(this.getSongLabelLines(activeSong));
            if (this.els.coverPill) this.els.coverPill.textContent = `Song ${activeSong.journey}`;
        }

            setBottomNav() {
            const isGallery = this.state.mode === "gallery";
            const isVideos = this.state.mode === "videos";
            const isDetail = this.state.mode === "detail";
            this.els.navA.textContent = isDetail ? "Prev" : "Videos";
            this.els.navB.textContent = isDetail ? "Home" : "Gallery";
            this.els.navC.textContent = isDetail ? "Next" : "About";
            this.els.navA.classList.toggle("ophf-bottomBtnActive", isVideos);
            this.els.navB.classList.toggle("ophf-bottomBtnActive", isGallery);
            this.els.navC.classList.remove("ophf-bottomBtnActive");
            if (isVideos) {
                this.els.navA.setAttribute("aria-current", "page");
            } else {
                this.els.navA.removeAttribute("aria-current");
            }
            if (isGallery) {
                this.els.navB.setAttribute("aria-current", "page");
            } else {
                this.els.navB.removeAttribute("aria-current");
            }
            this.els.navC.removeAttribute("aria-current");
            }

            getActiveScreenRoute() {
            return this.screenRoutes.find((route) => route.isActive(this.state)) || this.screenRoutes[0];
        }

            syncRoute(replace = false) {
            const activeRoute = this.getActiveScreenRoute();
            const nextHash = activeRoute.buildHash(this.state, this);
            if (location.hash === nextHash) return;
            if (replace) {
                history.replaceState(null, "", nextHash);
                return;
            }
            this.ignoreNextHashChange = true;
            location.hash = nextHash;
        }

            applyRouteFromHash() {
            const route = location.hash.replace(/^#/, "").trim();
            for (const screenRoute of this.screenRoutes) {
                if (screenRoute.matches(route, this)) {
                    screenRoute.apply(this, route);
                    return;
                }
            }
            this.screenRoutes[0].apply(this, route);
        }

            handleHashChange() {
            if (this.ignoreNextHashChange) {
                this.ignoreNextHashChange = false;
                return;
            }
            this.applyRouteFromHash();
        }

            openGallery(options = {}) {
            const { skipRoute = false } = options;
            this.videosView.deactivate();
            this.state.mode = "gallery";
            this.els.app.dataset.ophfMode = "gallery";
            this.renderCover();
            this.setBottomNav();
            this.scheduleSpiralUpdate();
            if (!skipRoute) this.syncRoute();
        }

            openVideos(options = {}) {
            const { skipRoute = false } = options;
            this.state.mode = "videos";
            this.els.app.dataset.ophfMode = "videos";
            this.videosView.activate();
            this.renderCover();
            this.setBottomNav();
            if (!skipRoute) this.syncRoute();
        }

            openSong(songId, versionIndex = 0, options = {}) {
            const { skipRoute = false } = options;
            this.videosView.deactivate();
            this.state.mode = "detail";
            this.state.songId = songId;
            this.state.versionIndex = versionIndex;
            this.els.app.dataset.ophfMode = "detail";
            this.renderDetail();
            this.setBottomNav();
            if (!skipRoute) this.syncRoute();
        }

            moveSong(direction) {
            const ordered = this.songs.slice().sort((a, b) => a.journey - b.journey);
            const currentIndex = ordered.findIndex((song) => song.id === this.state.songId);
            const nextIndex = (currentIndex + direction + ordered.length) % ordered.length;
            this.openSong(ordered[nextIndex].id);
        }

            shareCurrent() {
            const song = this.getSong(this.state.songId);
            const shareData = {
                title: `OPAHiFi — ${song.title}`,
                text: `Listen to ${song.title} on OPAHiFi`,
                url: `${location.origin}${location.pathname}#${song.id}`
            };

            if (navigator.share) {
                navigator.share(shareData).catch(() => { });
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(shareData.url);
            }
        }

            bindEvents() {
            this.els.latest.addEventListener("click", () => this.openSong(this.getLatestSong().id));
            this.els.playAll.addEventListener("click", () => this.openSong(this.playlistOrder[0]));

            this.els.navA.addEventListener("click", () => {
                if (this.state.mode === "detail") {
                    this.moveSong(-1);
                    return;
                }
                if (this.state.mode === "gallery") this.openVideos();
            });

            this.els.navB.addEventListener("click", () => {
                if (this.state.mode === "detail" || this.state.mode === "videos") this.openGallery();
            });

            this.els.navC.addEventListener("click", () => {
                if (this.state.mode === "detail") this.moveSong(1);
            });

            window.addEventListener("resize", this.scheduleSpiralUpdate);
            window.addEventListener("hashchange", this.handleHashChange);

            if ("ResizeObserver" in window && this.els.songField) {
                this.mapResizeObserver = new ResizeObserver(this.scheduleSpiralUpdate);
                this.mapResizeObserver.observe(this.els.songField);
            }
        }

            init() {
            this.renderMap();
            this.videosView.render();
            this.renderRail();
            this.bindEvents();
            this.setBottomNav();
            this.renderCover();

            if (location.hash) {
                this.applyRouteFromHash();
            } else {
                this.syncRoute(true);
            }
        }


        }

        new OpaHifiGalleryApp().init();
    </script>
