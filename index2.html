<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OPAHiFi Backbone Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Oswald:wght@500;600;700&family=Poppins:wght@300;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="src/pages/gallery/gallery.css">
    <link rel="stylesheet" href="src/pages/videos/videos.css">
    <link rel="stylesheet" href="src/pages/song-detail/detail.css">
    <style>
        :root {
            --ophf-cover-area: 24dvh;
            --ophf-nav-button-h: 30px;
            --ophf-nav-button-w: clamp(86px, 28vw, 138px);
            --ophf-nav-gap: 8px;
            --ophf-nav-pad-top: 8px;
            --ophf-nav-pad-bottom: max(8px, env(safe-area-inset-bottom));
            --ophf-nav-h: calc(var(--ophf-nav-button-h) + var(--ophf-nav-pad-top) + var(--ophf-nav-pad-bottom));
            --ophf-topbar-h: 44px;
            --ophf-rail-h: 76px;
            --ophf-listen-btn-size: 40px;
            --ophf-listen-icon-size: 20px;
            --ophf-listen-gap: 9px;
            --ophf-promo-content-max: 900px;
            --ophf-gallery-map-max-w: calc(var(--ophf-nav-button-w) + var(--ophf-nav-button-w) + var(--ophf-nav-button-w) + var(--ophf-nav-gap) + var(--ophf-nav-gap));
            --ophf-gallery-map-max-h: 680px;
            --ophf-gallery-pad: clamp(8px, 2.5vw, 18px);
            --ophf-gallery-gap: clamp(8px, 2.4vw, 14px);
            --ophf-promo-band-h: clamp(68px, 13dvh, 92px);
            --ophf-main-h: calc(100dvh - var(--ophf-cover-area) - var(--ophf-nav-h));
            --ophf-main-h-detail: calc(100dvh - var(--ophf-cover-area) - var(--ophf-nav-h) - var(--ophf-rail-h));
            --ophf-gallery-panel-h: calc(100dvh - var(--ophf-cover-area) - var(--ophf-nav-h) - (var(--ophf-gallery-pad) * 2));
            --ophf-black: #020204;
            --ophf-purple: #25123D;
            --ophf-royal: #182475;
            --ophf-blue: #254EB5;
            --ophf-bright: #6B95DC;
            --ophf-violet: #6351B4;
            --ophf-magenta: #C34DAC;
            --ophf-pink: #E44261;
            --ophf-red: #770D1F;
            --ophf-fire: #DC3612;
            --ophf-lavender: #BFBEEE;
            --ophf-light: #F8F8F8;
            --ophf-node: 60px;
            --ophf-node-label-h: 18px;
            --ophf-node-label-gap: 5px;
            --ophf-node-total: calc(var(--ophf-node) + var(--ophf-node-label-h) + var(--ophf-node-label-gap));
            --ophf-node-art-h: 153.846%;
            --ophf-radius-xl: 26px;
            --ophf-radius-md: 18px;
            --ophf-ease: 180ms ease;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--ophf-black);
            color: var(--ophf-light);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        select,
        a {
            font: inherit;
        }

        button {
            border: 0;
            color: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .ophf-app {
            position: relative;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background:
                radial-gradient(circle at 25% 10%, rgba(195, 77, 172, 0.25), transparent 28%),
                radial-gradient(circle at 80% 34%, rgba(37, 78, 181, 0.22), transparent 32%),
                linear-gradient(180deg, #040407 0%, #10071d 50%, #020204 100%);
        }

        .ophf-coverArea {
            position: fixed;
            inset: 0 0 auto 0;
            z-index: 20;
            height: var(--ophf-cover-area);
            overflow: hidden;
            border-bottom: 1px solid rgba(248, 248, 248, 0.1);
            background:
                linear-gradient(180deg, rgba(2, 2, 4, 0.96), rgba(2, 2, 4, 0.72)),
                radial-gradient(circle at 50% 20%, rgba(99, 81, 180, 0.28), transparent 45%);
        }

        .ophf-coverArea::after {
            content: "";
            position: absolute;
            inset: auto 0 0 0;
            height: 42%;
            background: linear-gradient(180deg, transparent, rgba(2, 2, 4, 0.94));
            pointer-events: none;
        }

        .ophf-navbar {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: var(--ophf-topbar-h);
            padding: 0 clamp(12px, 4vw, 32px);
        }

        .ophf-wordmark {
            display: inline-flex;
            align-items: baseline;
            gap: 0.04em;
            font-family: Poppins, Inter, system-ui, sans-serif;
            text-transform: none;
            line-height: 0.9;
            color: var(--ophf-light);
            text-shadow: 0 0 22px rgba(107, 149, 220, 0.6);
        }

        .ophf-wordmarkOpa {
            font-weight: 900;
            font-size: clamp(25px, 7.8vw, 39px);
            letter-spacing: -0.06em;
        }

        .ophf-wordmarkHiFi {
            margin-left: 0.08em;
            font-weight: 600;
            font-size: clamp(22px, 6.7vw, 34px);
            letter-spacing: -0.01em;
        }

        .ophf-menuBtn {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 999px;
            background: rgba(248, 248, 248, 0.08);
            box-shadow: inset 0 0 0 1px rgba(248, 248, 248, 0.14);
        }

        .ophf-menuGlyph,
        .ophf-menuGlyph::before,
        .ophf-menuGlyph::after {
            display: block;
            width: 18px;
            height: 2px;
            border-radius: 99px;
            background: var(--ophf-light);
        }

        .ophf-menuGlyph {
            position: relative;
        }

        .ophf-menuGlyph::before,
        .ophf-menuGlyph::after {
            content: "";
            position: absolute;
            left: 0;
        }

        .ophf-menuGlyph::before {
            top: -6px;
        }

        .ophf-menuGlyph::after {
            top: 6px;
        }

        .ophf-coverSlot {
            position: absolute;
            inset: var(--ophf-topbar-h) 0 0 0;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-coverSlot {
            place-items: end center;
        }

        .ophf-coverImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 58%;
            opacity: 0.78;
            filter: saturate(1.12) contrast(1.04);
            transform: scale(1.02);
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-coverImg {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: min(100%, 460px);
            max-width: none;
            height: calc(100% * 1.53846);
            object-fit: fill;
            object-position: center bottom;
            opacity: 0.9;
            filter: blur(22px) saturate(1.08) contrast(1.02);
            transform: translateX(-50%) scale(1.08);
        }

        .ophf-coverTitle {
            position: absolute;
            z-index: 3;
            left: clamp(12px, 4vw, 32px);
            right: clamp(12px, 4vw, 32px);
            bottom: 10px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            pointer-events: none;
        }

        .ophf-coverKicker {
            margin: 0 0 3px;
            font-family: Oswald, sans-serif;
            font-size: 11px;
            letter-spacing: 0.16em;
            color: var(--ophf-lavender);
            text-transform: uppercase;
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-coverKicker {
            color: var(--ophf-purple);
        }

        .ophf-coverName {
            margin: 0;
            max-width: 74vw;
            font-family: Oswald, sans-serif;
            font-size: clamp(18px, 5vw, 34px);
            line-height: 0.92;
            text-transform: uppercase;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.9);
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-coverName {
            max-width: 100%;
            font-size: clamp(28px, 9.2vw, 64px);
            line-height: 0.82;
        }

        .ophf-coverNameLine {
            display: block;
        }

        .ophf-diveBtn {
            display: none;
            flex: 0 0 auto;
            min-height: 40px;
            padding: 0 16px;
            border-radius: 999px;
            background:
                radial-gradient(circle at 20% 0%, rgba(195, 77, 172, 0.72), transparent 42%),
                linear-gradient(135deg, rgba(37, 78, 181, 0.88), rgba(119, 13, 31, 0.8));
            box-shadow: inset 0 0 0 1px rgba(248, 248, 248, 0.16);
            color: var(--ophf-light);
            font-family: Oswald, sans-serif;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            pointer-events: auto;
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-diveBtn {
            display: inline-grid;
            place-items: center;
        }

        .ophf-main {
            position: fixed;
            top: var(--ophf-cover-area);
            right: 0;
            left: 0;
            height: var(--ophf-main-h);
            z-index: 5;
            min-height: 0;
            overflow: hidden;
        }

        .ophf-screen {
            width: 100%;
            height: 100%;
            min-height: 0;
            display: none;
        }

        .ophf-app[data-ophf-mode="gallery"] .ophf-galleryScreen,
        .ophf-app[data-ophf-mode="videos"] .ophf-videosScreen,
        .ophf-app[data-ophf-mode="detail"] .ophf-detailScreen {
            display: block;
        }

        .ophf-bottomNav {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 30;
            display: grid;
            grid-template-columns: repeat(3, var(--ophf-nav-button-w));
            justify-content: center;
            height: var(--ophf-nav-h);
            padding: var(--ophf-nav-pad-top) clamp(8px, 3vw, 18px) var(--ophf-nav-pad-bottom);
            gap: var(--ophf-nav-gap);
            background: rgba(2, 2, 4, 0.94);
            border-top: 1px solid rgba(248, 248, 248, 0.1);
        }

        .ophf-bottomBtn {
            display: grid;
            place-items: center;
            width: 100%;
            max-width: 148px;
            min-height: var(--ophf-nav-button-h);
            border-radius: 999px;
            background: rgba(248, 248, 248, 0.055);
            color: rgba(248, 248, 248, 0.78);
            font-family: Oswald, sans-serif;
            font-size: 12px;
            letter-spacing: 0.09em;
            text-decoration: none;
            text-transform: uppercase;
            box-shadow:
                inset 0 0 0 1px rgba(248, 248, 248, 0.1),
                0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform var(--ophf-ease), box-shadow var(--ophf-ease), background var(--ophf-ease), color var(--ophf-ease);
        }

        .ophf-app[data-ophf-mode="gallery"] .ophf-bottomBtn[data-ophf-nav-b],
        .ophf-bottomBtnActive {
            background:
                linear-gradient(180deg, rgba(107, 149, 220, 0.52), rgba(99, 81, 180, 0.42)),
                rgba(37, 78, 181, 0.72);
            color: var(--ophf-light);
            transform: translateY(1px);
            box-shadow:
                inset 0 0 0 1px rgba(248, 248, 248, 0.42),
                inset 0 1px 0 rgba(255, 255, 255, 0.24),
                0 0 22px rgba(107, 149, 220, 0.5);
        }

        @media (min-width: 760px) {
            :root {
                --ophf-cover-area: 24dvh;
                --ophf-promo-band-h: 84px;
            }
        }
    </style>
</head>

<body>
    <div class="ophf-app" data-ophf-mode="gallery">
        <header class="ophf-coverArea">
            <nav class="ophf-navbar" aria-label="Main navigation">
                <div class="ophf-wordmark" aria-label="OPAHiFi">
                    <span class="ophf-wordmarkOpa">opa</span><span class="ophf-wordmarkHiFi">HiFi</span>
                </div>
                <button class="ophf-menuBtn" type="button" aria-label="Open menu">
                    <span class="ophf-menuGlyph" aria-hidden="true"></span>
                </button>
            </nav>

            <div class="ophf-coverSlot">
                <img class="ophf-coverImg" data-ophf-cover-img src="/img/opa/cover.png" alt="" />
            </div>

            <div class="ophf-coverTitle">
                <div>
                    <p class="ophf-coverKicker" data-ophf-cover-kicker>Gallery Map</p>
                    <h1 class="ophf-coverName" data-ophf-cover-name>OpaHiFi Journey</h1>
                </div>
                <button class="ophf-diveBtn" type="button">Dive In &gt;</button>
            </div>
        </header>

        <main class="ophf-main">
            <section class="ophf-screen ophf-galleryScreen" aria-label="Gallery map">
                <div class="ophf-galleryPanel">
                    <div class="ophf-promoBand">
                        <button class="ophf-promoTile ophf-promoTileLatest" type="button" data-ophf-latest>
                            <span class="ophf-promoEyebrow">Latest Release</span>
                            <span class="ophf-promoTitle">Wellwolf</span>
                            <span class="ophf-promoLatestArt" aria-hidden="true">
                                <img src="img/music/base/base-wellwolfhowllehluya.png" alt="">
                            </span>
                        </button>
                        <button class="ophf-promoTile ophf-promoTilePlay" type="button" data-ophf-playall>
                            <span class="ophf-promoEyebrow">Playlist Order</span>
                            <span class="ophf-promoTitle">Play All</span>
                            <img class="ophf-promoPlaylistBtn" src="img/btns/playlist.png" alt="" aria-hidden="true">
                        </button>
                    </div>

                    <div class="ophf-fieldStage">
                        <div class="ophf-songField" aria-label="Journey song map" data-ophf-song-field>
                            <svg class="ophf-spiralSvg" viewBox="0 0 3 3" aria-hidden="true" data-ophf-spiral-svg>
                                <defs>
                                    <linearGradient id="ophfSpiralGradient" x1="0" y1="0" x2="3" y2="3"
                                        gradientUnits="userSpaceOnUse" data-ophf-spiral-gradient>
                                        <stop offset="0" stop-color="#6B95DC" />
                                        <stop offset="0.46" stop-color="#C34DAC" />
                                        <stop offset="1" stop-color="#DC3612" />
                                    </linearGradient>
                                </defs>
                                <path class="ophf-spiralGlow" data-ophf-spiral-glow
                                    d="M .5 .5 L 1.5 .5 L 2.5 .5 L 2.5 1.5 L 2.5 2.5 L 1.5 2.5 L .5 2.5 L .5 1.5 L 1.5 1.5" />
                                <path class="ophf-spiralLine" data-ophf-spiral-line
                                    d="M .5 .5 L 1.5 .5 L 2.5 .5 L 2.5 1.5 L 2.5 2.5 L 1.5 2.5 L .5 2.5 L .5 1.5 L 1.5 1.5" />
                            </svg>
                            <div class="ophf-mapGrid" data-ophf-map-grid></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="ophf-screen ophf-videosScreen" aria-label="Videos">
                <div class="ophf-videosPanel">
                    <div class="ophf-videoGrid" data-ophf-video-grid></div>

                    <div class="ophf-videoGuide" data-ophf-video-guide="default" aria-live="polite">
                        <span class="ophf-videoGuideThumb" aria-hidden="true">
                            <img src="img/opa/videos/opa-meet.png" alt="">
                        </span>
                        <span class="ophf-videoGuideCopy">
                            <span class="ophf-videoGuideKicker">Opa says</span>
                            <span class="ophf-videoGuideText" data-ophf-video-guide-text>Choose your chaos.</span>
                        </span>
                        <span class="ophf-videoGuideTag" data-ophf-video-guide-tag>Vault</span>
                    </div>
                </div>

            </section>

            <section class="ophf-screen ophf-detailScreen" aria-label="Version detail">
                <div class="ophf-detailScroller">
                    <article class="ophf-trackPanel">
                        <img class="ophf-trackCover" data-ophf-track-cover alt="" />
                        <div class="ophf-trackMeta">
                            <h2 class="ophf-trackTitle" data-ophf-track-title></h2>
                            <div class="ophf-versionMeta">
                                <p class="ophf-versionMetaText" data-ophf-version-meta></p>
                                <div class="ophf-versionNav" data-ophf-version-nav></div>
                            </div>
                            <p class="ophf-versionTitle" data-ophf-version-title></p>
                        </div>
                        <div class="ophf-trackActions">
                            <div class="ophf-listenGrid" data-ophf-links></div>
                            <div class="ophf-shareSlot" data-ophf-share></div>
                        </div>
                    </article>

                    <section class="ophf-detailBlock ophf-detailBlockLyrics">
                        <h3 class="ophf-detailHeading">Lyrics</h3>
                        <p class="ophf-lyrics" data-ophf-lyrics></p>
                    </section>

                </div>
            </section>
        </main>

        <aside class="ophf-miniRail" data-ophf-mini-rail aria-label="Mini song rail"></aside>

        <nav class="ophf-bottomNav" aria-label="Bottom navigation">
            <button class="ophf-bottomBtn" type="button" data-ophf-nav-a>Videos</button>
            <button class="ophf-bottomBtn ophf-bottomBtnActive" type="button" data-ophf-nav-b>Gallery</button>
            <button class="ophf-bottomBtn" type="button" data-ophf-nav-c>About</button>
        </nav>
    </div>

    <script src="src/pages/gallery/GalleryRoute.js"></script>
    <script src="src/pages/gallery/GalleryPage.js"></script>
    <script src="src/pages/videos/VideosPage.js"></script>
    <script src="src/pages/song-detail/DetailPage.js"></script>
    <script src="src/pages/song-detail/DetailRoute.js"></script>
    <script>
        class OpaHifiGalleryApp {
            static basePath = "/img/music/base/";
            static heroCover = "/img/opa/cover.png";
            static latestSongId = "wellwolf";

            static songs = [
                {
                    id: "fullmindness",
                    journey: 1,
                    grid: [1, 1],
                    title: "Full-Mindness",
                    labelLines: ["Full-", "Mindness"],
                    file: "base-fullmindness.png",
                    versions: [
                        {
                            title: "Opa Mayhem Mix",
                            image: "img/music/versions/version-fullmindness-mayhemmix.png",
                            mixColors: ["#60c6e6", "#5c14b5"],
                            lyricsPath: "lyrics/full-mindness.txt",
                            links: {
                                Spotify: "https://open.spotify.com/track/6lp1u1WV8q0Aqfej1YeF8v?si=35f35519ca434960",
                                Apple: "https://music.apple.com/ng/song/full-mindness-opa-mayhem-mix/1879704886",
                                YouTube: "https://youtu.be/lE193jDewd4?si=YywLQUMDj7DPgCwh",
                                "YouTube Music": "https://music.youtube.com/watch?v=lE193jDewd4&si=D9lyKQ-KrLwWuZ0Z",
                                Amazon: "https://music.amazon.com/albums/B0GPL4Q4R5?marketplaceId=ATVPDKIKX0DER&musicTerritory=US&ref=dm_sh_sac7n1RtCHUgR8GuzWLD1fZ7D&trackAsin=B0GPLBB653"
                            },
                            lyrics: "Breathe in the chaos, exhale with flair.\nYou’re way out of control — but at least you're aware.\nLife’s a spinning class — on a bike with no seat.",
                            notes: "Journey opener. Chaos is not solved yet; it becomes the rhythm."
                        }
                    ]
                },
                {
                    id: "brunch",
                    journey: 2,
                    grid: [1, 2],
                    title: "Yeah, Let’s Do Brunch",
                    labelLines: ["Yeah, Let’s", "Do Brunch"],
                    file: "base-yeahletsdobrunch.png",
                    versions: [
                        {
                            title: "Main Version",
                            mixColors: ["#ffffff"],
                            lyricsPath: "lyrics/yeah-lets-do-brunch.txt",
                            links: {
                                Spotify: "https://open.spotify.com/track/10pJOBA2Krl8QiAi7XUGE7?si=66f1ed7937454034",
                                Apple: "https://music.apple.com/us/album/lets-do-brunch-single/1883970912",
                                YouTube: "https://youtu.be/nlRw2m9_Qh4?si=Xe-ZF1Ogg2ynabpj",
                                "YouTube Music": "https://music.youtube.com/watch?v=nlRw2m9_Qh4&si=G1BKK_61Wf_EIast",
                                Amazon: "https://music.amazon.com/albums/B0GS2JC8QD?marketplaceId=ATVPDKIKX0DER&musicTerritory=US&ref=dm_sh_CGFq3eGi1CLBa46vBJBJNB3oc&trackAsin=B0GS23XMP6"
                            },
                            lyrics: "Yeah let's do brunch\nSo sad we lost touch\nI miss you so so much\nI just need to finish my memoir.",
                            notes: "The fake-connection chapter. Warm words, empty follow-through."
                        }
                    ]
                },
                {
                    id: "hallucinating",
                    journey: 3,
                    grid: [1, 3],
                    title: "Hallucinating",
                    labelLines: ["Hallucinating", "Dum Dum"],
                    file: "base-hallucinatingdumdum.png",
                    versions: [
                        {
                            title: "Main Version",
                            mixColors: ["#ffffff"],
                            lyricsPath: "lyrics/hallucinating-dum-dum.txt",
                            links: {
                                Spotify: "https://open.spotify.com/track/74dIXy89cJ5oPrG9MFGd3X?si=91d0eec0dfd54961",
                                Apple: "https://music.apple.com/us/song/hallucinating-dum-dum/6776020941",
                                YouTube: "https://youtu.be/d5x0I9ffxwI?si=3ehe5ANC_b68E693",
                                "YouTube Music": "https://music.youtube.com/watch?v=d5x0I9ffxwI&si=XE-Yl4gqJkmqfsJk",
                                Amazon: "https://music.amazon.com/albums/B0H3PX4NXX?marketplaceId=ATVPDKIKX0DER&musicTerritory=US&ref=dm_sh_zWfHrxwuQbquYWxem0QHrLJzx&trackAsin=B0H3PZ7XM1"
                            },
                            lyrics: "Hallucinating\nMe, me, and I\nHallucinating\nWatchin’ life fly by\nLike a dumb bot.",
                            notes: "The crash point: human panic starts behaving like a broken model."
                        }
                    ]
                },
                {
                    id: "splenda",
                    journey: 4,
                    grid: [2, 3],
                    title: "Splenda Love Rabbit Hell",
                    labelLines: ["Splenda Love", "Rabbit Hell"],
                    file: "base-splendaloverabbithell.png",
                    versions: [
                        {
                            title: "Opa Max Mix",
                            image: "img/music/versions/version-splendaloverabbithell-maxmix.png",

            static playlistOrder = [
                "opaparty",
                "wellwolf",
                "glittaa",
                "truthfairy",
                "fullmindness",
                "hallucinating",
                "splenda",
                "oldlove",
                "brunch"
            ];

            static platforms = ["Spotify", "Apple", "YouTube", "YouTube Music", "Amazon"];
            static platformIcons = {
                Spotify: "img/ico/spotify-white.svg",
                Apple: "img/ico/apple-white.svg",
                YouTube: "img/ico/youtube-white.svg",
                "YouTube Music": "img/ico/youtubemusic-white.svg",
                Amazon: "img/ico/amazon-white.svg"
            };


            constructor(options = {}) {
                this.basePath = options.basePath || this.constructor.basePath;
                this.heroCover = options.heroCover || this.constructor.heroCover;
                this.latestSongId = options.latestSongId || this.constructor.latestSongId;
                this.songs = options.songs || this.constructor.songs;
                this.playlistOrder = options.playlistOrder || this.constructor.playlistOrder;
                this.platforms = options.platforms || this.constructor.platforms;
                this.platformIcons = options.platformIcons || this.constructor.platformIcons;
                this.els = {
                    app: document.querySelector(".ophf-app"),
                    coverImg: document.querySelector("[data-ophf-cover-img]"),
                    coverKicker: document.querySelector("[data-ophf-cover-kicker]"),
                    coverName: document.querySelector("[data-ophf-cover-name]"),
                    coverPill: document.querySelector("[data-ophf-cover-pill]"),
                    songField: document.querySelector("[data-ophf-song-field]"),
                    mapGrid: document.querySelector("[data-ophf-map-grid]"),
                    spiralSvg: document.querySelector("[data-ophf-spiral-svg]"),
                    spiralGradient: document.querySelector("[data-ophf-spiral-gradient]"),
                    spiralGlow: document.querySelector("[data-ophf-spiral-glow]"),
                    spiralLine: document.querySelector("[data-ophf-spiral-line]"),
                    videoGrid: document.querySelector("[data-ophf-video-grid]"),
                    latest: document.querySelector("[data-ophf-latest]"),
                    playAll: document.querySelector("[data-ophf-playall]"),
                    trackCover: document.querySelector("[data-ophf-track-cover]"),
                    shareSlot: document.querySelector("[data-ophf-share]"),
                    trackTitle: document.querySelector("[data-ophf-track-title]"),
                    versionMeta: document.querySelector("[data-ophf-version-meta]"),
                    versionNav: document.querySelector("[data-ophf-version-nav]"),
                    versionTitle: document.querySelector("[data-ophf-version-title]"),
                    links: document.querySelector("[data-ophf-links]"),
                    lyrics: document.querySelector("[data-ophf-lyrics]"),
                    miniRail: document.querySelector("[data-ophf-mini-rail]"),
                    navA: document.querySelector("[data-ophf-nav-a]"),
                    navB: document.querySelector("[data-ophf-nav-b]"),
                    navC: document.querySelector("[data-ophf-nav-c]")
                };
                this.state = {
                    mode: "gallery",
                    songId: "wellwolf",
                    versionIndex: 0
                };
                this.ignoreNextHashChange = false;
                this.screenRoutes = [
                    new OpaHifiGalleryRoute(),
                    new OpaHifiVideosRoute(),
                    new OpaHifiDetailRoute()
                ];
                this.galleryPage = new OpaHifiGalleryPage({
                    els: this.els,
                    songs: this.songs,
                    coverUrl: (song) => this.coverUrl(song),
                    setImageFallback: (img, song) => this.setImageFallback(img, song),
                    onOpenSong: (songId) => this.openSong(songId),
                    onOpenLatest: () => this.openSong(this.getLatestSong().id),
                    onPlayAll: () => this.openSong(this.playlistOrder[0])
                });
                this.videosView = new OpaHifiVideosView(this.els.videoGrid);
                this.detailPage = new OpaHifiDetailPage({
                    els: {
                        trackCover: this.els.trackCover,
                        shareSlot: this.els.shareSlot,
                        trackTitle: this.els.trackTitle,
                        versionMeta: this.els.versionMeta,
                        versionNav: this.els.versionNav,
                        versionTitle: this.els.versionTitle,
                        links: this.els.links,
                        lyrics: this.els.lyrics,
                        miniRail: this.els.miniRail
                    },
                    songs: this.songs,
                    platforms: this.platforms,
                    platformIcons: this.platformIcons,
                    coverUrl: (song) => this.coverUrl(song),
                    versionImageUrl: (song, version) => version.image || this.coverUrl(song),
                    onOpenSong: (songId, versionIndex = 0) => this.openSong(songId, versionIndex)
                });
                this.handleHashChange = this.handleHashChange.bind(this);
            }

            coverUrl(song) {
                return `${this.basePath}${song.file}`;
            }

            getSong(id) {
                return this.songs.find((song) => song.id === id) || this.songs[0];
            }

            getLatestSong() {
                return this.getSong(this.latestSongId);
            }

            setImageFallback(img, song) {
                img.onerror = () => {
                    img.onerror = null;
                    img.style.display = "none";
                    if (img.parentElement && !img.parentElement.querySelector(".ophf-songNodeFallback")) {
                        const fallback = document.createElement("span");
                        fallback.className = "ophf-songNodeFallback";
                        img.parentElement.appendChild(fallback);
                    }
                };
            }

            getSongLabelLines(song) {
                return song.labelLines && song.labelLines.length ? song.labelLines : [song.title];
            }

            setCoverTitle(lines) {
                this.els.coverName.innerHTML = "";
                lines.forEach((line) => {
                    const lineEl = document.createElement("span");
                    lineEl.className = "ophf-coverNameLine";
                    lineEl.textContent = line;
                    this.els.coverName.appendChild(lineEl);
                });
            }

            renderCover(song = null) {
                if (this.state.mode === "gallery") {
                    this.els.coverImg.src = this.heroCover;
                    this.els.coverImg.style.display = "block";
                    this.els.coverKicker.textContent = "Gallery Map";
                    this.setCoverTitle(["OPAHiFi Journey"]);
                    if (this.els.coverPill) this.els.coverPill.textContent = "3x3 Map";
                    return;
                }

                if (this.state.mode === "videos") {
                    this.els.coverImg.src = this.heroCover;
                    this.els.coverImg.style.display = "block";
                    this.els.coverKicker.textContent = "Video Vault";
                    this.setCoverTitle(["ClipOpa"]);
                    if (this.els.coverPill) this.els.coverPill.textContent = "Playlists";
                    return;
                }

                const activeSong = song || this.getSong(this.state.songId);
                this.els.coverImg.src = this.coverUrl(activeSong);
                this.els.coverImg.style.display = "block";
                this.els.coverKicker.textContent = "Now Viewing";
                this.setCoverTitle(this.getSongLabelLines(activeSong));
                if (this.els.coverPill) this.els.coverPill.textContent = `Song ${activeSong.journey}`;
            }

            setBottomNav() {
                const isGallery = this.state.mode === "gallery";
                const isVideos = this.state.mode === "videos";
                const isDetail = this.state.mode === "detail";
                this.els.navA.textContent = isDetail ? "Prev" : "Videos";
                this.els.navB.textContent = "Gallery";
                this.els.navC.textContent = isDetail ? "Next" : "About";
                this.els.navA.classList.toggle("ophf-bottomBtnActive", isVideos);
                this.els.navB.classList.toggle("ophf-bottomBtnActive", isGallery);
                this.els.navC.classList.remove("ophf-bottomBtnActive");
                if (isVideos) {
                    this.els.navA.setAttribute("aria-current", "page");
                } else {
                    this.els.navA.removeAttribute("aria-current");
                }
                if (isGallery) {
                    this.els.navB.setAttribute("aria-current", "page");
                } else {
                    this.els.navB.removeAttribute("aria-current");
                }
                this.els.navC.removeAttribute("aria-current");
            }

            getActiveScreenRoute() {
                return this.screenRoutes.find((route) => route.isActive(this.state)) || this.screenRoutes[0];
            }

            syncRoute(replace = false) {
                const activeRoute = this.getActiveScreenRoute();
                const nextHash = activeRoute.buildHash(this.state, this);
                if (location.hash === nextHash) return;
                if (replace) {
                    history.replaceState(null, "", nextHash);
                    return;
                }
                this.ignoreNextHashChange = true;
                location.hash = nextHash;
            }

            applyRouteFromHash() {
                const route = location.hash.replace(/^#/, "").trim();
                for (const screenRoute of this.screenRoutes) {
                    if (screenRoute.matches(route, this)) {
                        screenRoute.apply(this, route);
                        return;
                    }
                }
                this.screenRoutes[0].apply(this, route);
            }

            handleHashChange() {
                if (this.ignoreNextHashChange) {
                    this.ignoreNextHashChange = false;
                    return;
                }
                this.applyRouteFromHash();
            }

            openGallery(options = {}) {
            const { skipRoute = false } = options;
            this.galleryPage.activate();
            this.videosView.deactivate();
            this.detailPage.deactivate();
            this.state.mode = "gallery";
            this.els.app.dataset.ophfMode = "gallery";
            this.renderCover();
            this.setBottomNav();
            if (!skipRoute) this.syncRoute();
        }

            openVideos(options = {}) {
            const { skipRoute = false } = options;
            this.galleryPage.deactivate();
            this.detailPage.deactivate();
            this.state.mode = "videos";
            this.els.app.dataset.ophfMode = "videos";
            this.videosView.activate();
            this.renderCover();
            this.setBottomNav();
                if (!skipRoute) this.syncRoute();
            }

            openSong(songId, versionIndex = 0, options = {}) {
            const { skipRoute = false } = options;
            this.galleryPage.deactivate();
            this.videosView.deactivate();
            this.state.mode = "detail";
            this.state.songId = songId;
            this.state.versionIndex = versionIndex;
            this.els.app.dataset.ophfMode = "detail";
                this.detailPage.activate(songId, versionIndex);
                this.renderCover(this.getSong(songId));
                this.setBottomNav();
                if (!skipRoute) this.syncRoute();
            }

            moveSong(direction) {
                const ordered = this.songs.slice().sort((a, b) => a.journey - b.journey);
                const currentIndex = ordered.findIndex((song) => song.id === this.state.songId);
                const nextIndex = (currentIndex + direction + ordered.length) % ordered.length;
                this.openSong(ordered[nextIndex].id);
            }

            shareCurrent() {
                const song = this.getSong(this.state.songId);
                const shareData = {
                    title: `OPAHiFi — ${song.title}`,
                    text: `Listen to ${song.title} on OPAHiFi`,
                    url: `${location.origin}${location.pathname}#${song.id}`
                };

                if (navigator.share) {
                    navigator.share(shareData).catch(() => { });
                } else if (navigator.clipboard) {
                    navigator.clipboard.writeText(shareData.url);
                }
            }

            bindEvents() {
            this.els.navA.addEventListener("click", () => {
                if (this.state.mode === "detail") {
                    this.moveSong(-1);
                    return;
                    }
                    if (this.state.mode === "gallery") this.openVideos();
                });

                this.els.navB.addEventListener("click", () => {
                    if (this.state.mode === "detail" || this.state.mode === "videos") this.openGallery();
                });

                this.els.navC.addEventListener("click", () => {
                if (this.state.mode === "detail") this.moveSong(1);
            });

            window.addEventListener("hashchange", this.handleHashChange);
        }

            init() {
                this.galleryPage.activate();
                this.videosView.render();
                this.bindEvents();
                this.setBottomNav();
                this.renderCover();

                if (location.hash) {
                    this.applyRouteFromHash();
                } else {
                    this.syncRoute(true);
                }
            }


        }

        new OpaHifiGalleryApp().init();
    </script>
