<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OPAHiFi Backbone Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Oswald:wght@500;600;700&family=Poppins:wght@300;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --ophf-cover-area: 24dvh;
            --ophf-nav-button-h: 30px;
            --ophf-nav-button-w: clamp(86px, 28vw, 138px);
            --ophf-nav-gap: 8px;
            --ophf-nav-pad-top: 8px;
            --ophf-nav-pad-bottom: max(8px, env(safe-area-inset-bottom));
            --ophf-nav-h: calc(var(--ophf-nav-button-h) + var(--ophf-nav-pad-top) + var(--ophf-nav-pad-bottom));
            --ophf-topbar-h: 44px;
            --ophf-rail-h: 76px;
            --ophf-promo-content-max: 900px;
            --ophf-gallery-map-max-w: calc(var(--ophf-nav-button-w) + var(--ophf-nav-button-w) + var(--ophf-nav-button-w) + var(--ophf-nav-gap) + var(--ophf-nav-gap));
            --ophf-gallery-map-max-h: 680px;
            --ophf-gallery-pad: clamp(8px, 2.5vw, 18px);
            --ophf-gallery-gap: clamp(8px, 2.4vw, 14px);
            --ophf-promo-band-h: clamp(68px, 13dvh, 92px);
            --ophf-main-h: calc(100dvh - var(--ophf-cover-area) - var(--ophf-nav-h));
            --ophf-main-h-detail: calc(100dvh - var(--ophf-cover-area) - var(--ophf-nav-h) - var(--ophf-rail-h));
            --ophf-gallery-panel-h: calc(100dvh - var(--ophf-cover-area) - var(--ophf-nav-h) - (var(--ophf-gallery-pad) * 2));
            --ophf-black: #020204;
            --ophf-purple: #25123D;
            --ophf-royal: #182475;
            --ophf-blue: #254EB5;
            --ophf-bright: #6B95DC;
            --ophf-violet: #6351B4;
            --ophf-magenta: #C34DAC;
            --ophf-pink: #E44261;
            --ophf-red: #770D1F;
            --ophf-fire: #DC3612;
            --ophf-lavender: #BFBEEE;
            --ophf-light: #F8F8F8;
            --ophf-node: 60px;
            --ophf-node-label-h: 18px;
            --ophf-node-label-gap: 5px;
            --ophf-node-total: calc(var(--ophf-node) + var(--ophf-node-label-h) + var(--ophf-node-label-gap));
            --ophf-node-art-h: 153.846%;
            --ophf-radius-xl: 26px;
            --ophf-radius-md: 18px;
            --ophf-ease: 180ms ease;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--ophf-black);
            color: var(--ophf-light);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        select,
        a {
            font: inherit;
        }

        button {
            border: 0;
            color: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .ophf-app {
            position: relative;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background:
                radial-gradient(circle at 25% 10%, rgba(195, 77, 172, 0.25), transparent 28%),
                radial-gradient(circle at 80% 34%, rgba(37, 78, 181, 0.22), transparent 32%),
                linear-gradient(180deg, #040407 0%, #10071d 50%, #020204 100%);
        }

        .ophf-coverArea {
            position: fixed;
            inset: 0 0 auto 0;
            z-index: 20;
            height: var(--ophf-cover-area);
            overflow: hidden;
            border-bottom: 1px solid rgba(248, 248, 248, 0.1);
            background:
                linear-gradient(180deg, rgba(2, 2, 4, 0.96), rgba(2, 2, 4, 0.72)),
                radial-gradient(circle at 50% 20%, rgba(99, 81, 180, 0.28), transparent 45%);
        }

        .ophf-coverArea::after {
            content: "";
            position: absolute;
            inset: auto 0 0 0;
            height: 42%;
            background: linear-gradient(180deg, transparent, rgba(2, 2, 4, 0.94));
            pointer-events: none;
        }

        .ophf-navbar {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: var(--ophf-topbar-h);
            padding: 0 clamp(12px, 4vw, 32px);
        }

        .ophf-wordmark {
            display: inline-flex;
            align-items: baseline;
            gap: 0.04em;
            font-family: Poppins, Inter, system-ui, sans-serif;
            text-transform: none;
            line-height: 0.9;
            color: var(--ophf-light);
            text-shadow: 0 0 22px rgba(107, 149, 220, 0.6);
        }

        .ophf-wordmarkOpa {
            font-weight: 900;
            font-size: clamp(25px, 7.8vw, 39px);
            letter-spacing: -0.06em;
        }

        .ophf-wordmarkHiFi {
            margin-left: 0.08em;
            font-weight: 600;
            font-size: clamp(22px, 6.7vw, 34px);
            letter-spacing: -0.01em;
        }

        .ophf-menuBtn {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 999px;
            background: rgba(248, 248, 248, 0.08);
            box-shadow: inset 0 0 0 1px rgba(248, 248, 248, 0.14);
        }

        .ophf-menuGlyph,
        .ophf-menuGlyph::before,
        .ophf-menuGlyph::after {
            display: block;
            width: 18px;
            height: 2px;
            border-radius: 99px;
            background: var(--ophf-light);
        }

        .ophf-menuGlyph {
            position: relative;
        }

        .ophf-menuGlyph::before,
        .ophf-menuGlyph::after {
            content: "";
            position: absolute;
            left: 0;
        }

        .ophf-menuGlyph::before {
            top: -6px;
        }

        .ophf-menuGlyph::after {
            top: 6px;
        }

        .ophf-coverSlot {
            position: absolute;
            inset: var(--ophf-topbar-h) 0 0 0;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-coverSlot {
            place-items: end center;
        }

        .ophf-coverImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 58%;
            opacity: 0.78;
            filter: saturate(1.12) contrast(1.04);
            transform: scale(1.02);
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-coverImg {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: min(100%, 460px);
            max-width: none;
            height: calc(100% * 1.53846);
            object-fit: fill;
            object-position: center bottom;
            opacity: 0.9;
            filter: blur(22px) saturate(1.08) contrast(1.02);
            transform: translateX(-50%) scale(1.08);
        }

        .ophf-coverTitle {
            position: absolute;
            z-index: 3;
            left: clamp(12px, 4vw, 32px);
            right: clamp(12px, 4vw, 32px);
            bottom: 10px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            pointer-events: none;
        }

        .ophf-coverKicker {
            margin: 0 0 3px;
            font-family: Oswald, sans-serif;
            font-size: 11px;
            letter-spacing: 0.16em;
            color: var(--ophf-lavender);
            text-transform: uppercase;
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-coverKicker {
            color: var(--ophf-purple);
        }

        .ophf-coverName {
            margin: 0;
            max-width: 74vw;
            font-family: Oswald, sans-serif;
            font-size: clamp(18px, 5vw, 34px);
            line-height: 0.92;
            text-transform: uppercase;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.9);
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-coverName {
            max-width: 100%;
            font-size: clamp(28px, 9.2vw, 64px);
            line-height: 0.82;
        }

        .ophf-coverNameLine {
            display: block;
        }

        .ophf-diveBtn {
            display: none;
            flex: 0 0 auto;
            min-height: 40px;
            padding: 0 16px;
            border-radius: 999px;
            background:
                radial-gradient(circle at 20% 0%, rgba(195, 77, 172, 0.72), transparent 42%),
                linear-gradient(135deg, rgba(37, 78, 181, 0.88), rgba(119, 13, 31, 0.8));
            box-shadow: inset 0 0 0 1px rgba(248, 248, 248, 0.16);
            color: var(--ophf-light);
            font-family: Oswald, sans-serif;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            pointer-events: auto;
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-diveBtn {
            display: inline-grid;
            place-items: center;
        }

        .ophf-main {
            position: fixed;
            top: var(--ophf-cover-area);
            right: 0;
            left: 0;
            height: var(--ophf-main-h);
            z-index: 5;
            min-height: 0;
            overflow: hidden;
        }

        .ophf-app[data-ophf-mode="detail"] .ophf-main {
            height: var(--ophf-main-h-detail);
        }

        .ophf-screen {
            width: 100%;
            height: 100%;
            min-height: 0;
            display: none;
        }

        .ophf-app[data-ophf-mode="gallery"] .ophf-galleryScreen,
        .ophf-app[data-ophf-mode="detail"] .ophf-detailScreen {
            display: block;
        }

        .ophf-galleryScreen {
            overflow: hidden;
            padding: var(--ophf-gallery-pad);
        }

        .ophf-galleryPanel {
            height: var(--ophf-gallery-panel-h);
            min-height: 0;
            display: grid;
            grid-template-rows: var(--ophf-promo-band-h) minmax(0, 1fr);
            gap: var(--ophf-gallery-gap);
        }

        .ophf-promoBand {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--ophf-gallery-gap);
            height: var(--ophf-promo-band-h);
            min-height: var(--ophf-promo-band-h);
        }

        .ophf-promoTile {
            position: relative;
            min-width: 0;
            overflow: hidden;
            border-radius: var(--ophf-radius-md);
            padding: clamp(10px, 3vw, 16px);
            background:
                linear-gradient(145deg, rgba(248, 248, 248, 0.12), rgba(248, 248, 248, 0.035)),
                radial-gradient(circle at 15% 0%, rgba(228, 66, 97, 0.35), transparent 46%),
                rgba(37, 18, 61, 0.66);
            box-shadow:
                inset 0 0 0 1px rgba(248, 248, 248, 0.12),
                0 12px 30px rgba(0, 0, 0, 0.22);
            text-align: left;
        }

        .ophf-promoTile::after {
            content: "";
            position: absolute;
            inset: auto -16px -24px auto;
            width: 78px;
            height: 78px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(107, 149, 220, 0.48), transparent 68%);
            pointer-events: none;
        }

        .ophf-promoTilePlay {
            background:
                linear-gradient(145deg, rgba(248, 248, 248, 0.12), rgba(248, 248, 248, 0.035)),
                radial-gradient(circle at 80% 10%, rgba(37, 78, 181, 0.45), transparent 48%),
                rgba(24, 36, 117, 0.55);
        }

        .ophf-promoEyebrow {
            display: block;
            margin-bottom: 7px;
            font-family: Oswald, sans-serif;
            font-size: clamp(10px, 2.9vw, 13px);
            letter-spacing: 0.13em;
            text-transform: uppercase;
            color: var(--ophf-lavender);
        }

        .ophf-promoTitle {
            display: block;
            max-width: 13ch;
            font-family: Oswald, sans-serif;
            font-size: clamp(19px, 5.2vw, 30px);
            line-height: 0.92;
            text-transform: uppercase;
            color: var(--ophf-light);
        }

        .ophf-fieldStage {
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .ophf-songField {
            position: relative;
            height: min(100%, calc(100vw - clamp(20px, 5vw, 48px)));
            max-width: min(680px, calc(100vw - clamp(20px, 5vw, 48px)));
            aspect-ratio: 1 / 1;
            border-radius: clamp(18px, 5vw, 34px);
            overflow: hidden;
            background:
                linear-gradient(rgba(248, 248, 248, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(248, 248, 248, 0.045) 1px, transparent 1px),
                radial-gradient(circle at center, rgba(99, 81, 180, 0.22), transparent 58%),
                rgba(2, 2, 4, 0.28);
            background-size: 33.333% 33.333%, 33.333% 33.333%, 100% 100%, 100% 100%;
            box-shadow:
                inset 0 0 0 1px rgba(248, 248, 248, 0.09),
                0 24px 70px rgba(0, 0, 0, 0.25);
        }

        .ophf-spiralSvg {
            position: absolute;
            inset: 0;
            z-index: 1;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
        }

        .ophf-spiralGlow {
            fill: none;
            stroke: rgba(195, 77, 172, 0.45);
            stroke-width: clamp(10px, 1.3vw, 18px);
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: blur(3px);
        }

        .ophf-spiralLine {
            fill: none;
            stroke: url(#ophfSpiralGradient);
            stroke-width: clamp(4px, 0.65vw, 8px);
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ophf-mapGrid {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-template-rows: repeat(3, minmax(0, 1fr));
            width: 100%;
            height: 100%;
            padding-bottom: var(--ophf-node-label-h);
        }

        .ophf-mapCell {
            position: relative;
            min-width: 0;
            min-height: 0;
            container-type: size;
            --ophf-node-label-font-size: clamp(8px, 7cqh, 11px);
            --ophf-node-label-pad-y: 7px;
            --ophf-node-label-h: calc(var(--ophf-node-label-font-size) + var(--ophf-node-label-font-size) + var(--ophf-node-label-pad-y));
            --ophf-node-label-gap: 0px;
            --ophf-node-edge-pad: clamp(4px, 2.4cqh, 7px);
            --ophf-node-label-protrusion: calc(var(--ophf-node-label-h) * 0.78);
            --ophf-node-max: 74px;
            --ophf-node: clamp(34px,
                    calc(min(100cqw, 100cqh) - var(--ophf-node-label-protrusion) - var(--ophf-node-edge-pad) - var(--ophf-node-edge-pad)),
                    var(--ophf-node-max));
        }

        @media (min-width: 760px) {
            .ophf-mapCell {
                --ophf-node-max: 96px;
            }
        }

        .ophf-songUnit {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(96%, calc(var(--ophf-node) + 40px));
            height: var(--ophf-node);
            transform: translate(-50%, -50%);
        }

        .ophf-songNode {
            position: absolute;
            top: 0;
            left: 50%;
            width: var(--ophf-node);
            height: var(--ophf-node);
            border-radius: 999px;
            transform: translateX(-50%);
            overflow: hidden;
            background: #111;
            box-shadow:
                0 0 0 2px rgba(248, 248, 248, 0.9),
                0 0 0 5px rgba(2, 2, 4, 0.62),
                0 0 28px rgba(107, 149, 220, 0.36);
            transition: transform var(--ophf-ease), box-shadow var(--ophf-ease);
        }

        .ophf-songNode:active {
            transform: translateX(-50%) scale(0.95);
        }

        .ophf-nodeArtCrop {
            position: absolute;
            inset: 0;
            display: block;
            border-radius: inherit;
            overflow: hidden;
            background: var(--ophf-black);
        }

        .ophf-songNodeImg {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: var(--ophf-node-art-h);
            object-fit: cover;
            object-position: center bottom;
            display: block;
        }

        .ophf-songNodeFallback {
            position: absolute;
            inset: 0;
            display: block;
            background:
                radial-gradient(circle at 30% 22%, var(--ophf-pink), transparent 38%),
                radial-gradient(circle at 68% 72%, var(--ophf-blue), transparent 42%),
                linear-gradient(135deg, var(--ophf-purple), var(--ophf-black));
        }

        .ophf-songLabel {
            position: absolute;
            z-index: 3;
            top: 85%;
            left: 50%;
            width: min(100%, calc(var(--ophf-node) + 6px));
            min-height: var(--ophf-node-label-h);
            max-height: var(--ophf-node-label-h);
            padding: 3px 7px 4px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(2, 2, 4, 0.86);
            box-shadow:
                inset 0 0 0 1px rgba(248, 248, 248, 0.2),
                0 5px 13px rgba(0, 0, 0, 0.45);
            color: var(--ophf-light);
            font-family: Oswald, sans-serif;
            font-size: var(--ophf-node-label-font-size);
            font-weight: 700;
            letter-spacing: 0.045em;
            line-height: 0.9;
            text-align: center;
            text-transform: uppercase;
            text-shadow: none;
            pointer-events: none;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0;
        }

        .ophf-songLabelLine {
            display: block;
            white-space: nowrap;
        }

        .ophf-detailScreen {
            overflow: hidden;
            padding: clamp(10px, 3vw, 18px);
        }

        .ophf-detailScroller {
            width: min(760px, 100%);
            height: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: clamp(12px, 3vw, 18px);
            min-height: 0;
        }

        .ophf-trackPanel,
        .ophf-detailBlock {
            width: 100%;
            margin: 0;
            border-radius: var(--ophf-radius-xl);
            background: rgba(248, 248, 248, 0.07);
            box-shadow:
                inset 0 0 0 1px rgba(248, 248, 248, 0.11),
                0 18px 50px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(16px);
        }

        .ophf-trackPanel {
            display: grid;
            grid-template-columns: clamp(88px, 27vw, 170px) minmax(0, 1fr);
            gap: clamp(12px, 3.5vw, 18px);
            padding: clamp(12px, 3.5vw, 18px);
        }

        .ophf-trackCover {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            object-fit: cover;
            object-position: center 66%;
            box-shadow:
                0 0 0 1px rgba(248, 248, 248, 0.16),
                0 16px 35px rgba(0, 0, 0, 0.35);
            background: var(--ophf-purple);
        }

        .ophf-trackMeta {
            min-width: 0;
            --ophf-listen-btn-size: 30px;
            --ophf-listen-gap: 6px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        .ophf-trackActions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }

        .ophf-shareSlot {
            display: flex;
            justify-content: flex-end;
            flex: 0 0 auto;
            margin-left: 12px;
        }

        .ophf-trackTitle {
            margin: 0;
            font-family: Oswald, sans-serif;
            font-size: clamp(24px, 8vw, 42px);
            line-height: 0.94;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .ophf-trackTitle:empty {
            display: none;
        }

        .ophf-versionTitle {
            margin: 0;
            color: var(--ophf-lavender);
            font-size: clamp(22px, 5.8vw, 34px);
            font-weight: 700;
            line-height: 1;
        }

        .ophf-versionMeta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .ophf-versionMetaText {
            margin: 0;
            color: rgba(248, 248, 248, 0.72);
            font-family: Oswald, sans-serif;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .ophf-versionNav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ophf-versionJump {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-height: 28px;
            padding: 0 10px;
            border-radius: 999px;
            background: rgba(248, 248, 248, 0.08);
            box-shadow: inset 0 0 0 1px rgba(248, 248, 248, 0.14);
            color: var(--ophf-light);
        }

        .ophf-versionJumpGlyph {
            font-family: Oswald, sans-serif;
            font-size: 15px;
            line-height: 1;
        }

        .ophf-versionJumpSwatch {
            width: 12px;
            height: 12px;
            border-radius: 999px;
            box-shadow: inset 0 0 0 1px rgba(2, 2, 4, 0.12);
        }

        .ophf-listenGrid {
            display: flex;
            align-items: center;
            flex: 0 1 auto;
            min-width: 0;
        }

        .ophf-listenStrip {
            display: flex;
            flex-wrap: nowrap;
            gap: var(--ophf-listen-gap);
        }

        .ophf-listenBtn,
        .ophf-shareBtn,
        .ophf-bottomBtn {
            display: grid;
            place-items: center;
            width: 100%;
            max-width: 148px;
            min-height: 38px;
            border-radius: 999px;
            background: rgba(248, 248, 248, 0.1);
            box-shadow: inset 0 0 0 1px rgba(248, 248, 248, 0.13);
            color: var(--ophf-light);
            font-family: Oswald, sans-serif;
            font-size: 12px;
            letter-spacing: 0.09em;
            text-decoration: none;
            text-transform: uppercase;
        }

        .ophf-listenBtn {
            width: var(--ophf-listen-btn-size);
            max-width: var(--ophf-listen-btn-size);
            min-height: var(--ophf-listen-btn-size);
            border-radius: 10px;
            padding: 0;
        }

        .ophf-listenIcon {
            width: 15px;
            height: 15px;
            display: block;
            object-fit: contain;
        }

        .ophf-shareBtn {

                            "YouTube Music": "https://music.youtube.com/playlist?list=OLAK5uy_kyaEMBBaI0luWjB6ch9XqEbp4_dWNu3Mw",
                            Amazon: "https://music.amazon.com/albums/B0FYVMVZS4"
                        },
                        lyrics: "There ain’t no party like an\nOpa pa pa pa party\nWith all your party pi pi pi—\nPi pi people.",
                        notes: "The joy-release chapter. The journey becomes physical, loud, and communal."
                    }
                ]
            },
            {
                id: "wellwolf",
                journey: 9,
                grid: [2, 2],
                title: "Wellwolf Howl-Lehluya",
                labelLines: ["Wellwolf", "Howl-Lehluya"],
                file: "base-wellwolfhowllehluya.png",
                latest: true,
                versions: [
                    {
                        title: "Main Version",
                        mixColors: ["#ffffff"],
                        lyricsPath: "lyrics/wellwolf-hoawlehluya.txt",
                        links: {
                            Spotify: "https://open.spotify.com/track/4OHlXoJFuPhfm4plY7Coop?si=86049caec0384f95",
                            Apple: "https://music.apple.com/us/album/wellwolf-howl-lehluya-single/1894120765",
                            YouTube: "https://youtu.be/bjecZnXbXBc?si=Llwj6s7pyO2fRMmY",
                            "YouTube Music": "https://music.youtube.com/playlist?list=OLAK5uy_k3iThKSj0H5nDqf-dpU5EMM-ccRcglZaY&si=d2V3JFEBlqkSJi55",
                            Amazon: "https://music.amazon.com/tracks/B0GXHSFW83?marketplaceId=ATVPDKIKX0DER&musicTerritory=US&ref=dm_sh_YaZDAKqp0vQwgwM7y8yENc9Zw"
                        },
                        lyrics: "Wellwolf no bloodlust no fame thirst\nRun on love not to be first\nBite with kindness not to hurt\nBeat with heart not for sport.",
                        notes: "The kindness endpoint. The monster myth flips into care."
                    }
                ]
            }
        ];

        const ophfPlaylistOrder = [
            "opaparty",
            "wellwolf",
            "glittaa",
            "truthfairy",
            "fullmindness",
            "hallucinating",
            "splenda",
            "oldlove",
            "brunch"
        ];

        const ophfPlatforms = ["Spotify", "Apple", "YouTube", "YouTube Music", "Amazon"];
        const ophfPlatformIcons = {
            Spotify: "img/ico/spotify-white.svg",
            Apple: "img/ico/apple-white.svg",
            YouTube: "img/ico/youtube-white.svg",
            "YouTube Music": "img/ico/youtubemusic-white.svg",
            Amazon: "img/ico/amazon-white.svg"
        };

        const ophfEls = {
            app: document.querySelector(".ophf-app"),
            coverImg: document.querySelector("[data-ophf-cover-img]"),
            coverKicker: document.querySelector("[data-ophf-cover-kicker]"),
            coverName: document.querySelector("[data-ophf-cover-name]"),
            coverPill: document.querySelector("[data-ophf-cover-pill]"),
            songField: document.querySelector("[data-ophf-song-field]"),
            mapGrid: document.querySelector("[data-ophf-map-grid]"),
            spiralSvg: document.querySelector("[data-ophf-spiral-svg]"),
            spiralGradient: document.querySelector("[data-ophf-spiral-gradient]"),
            spiralGlow: document.querySelector("[data-ophf-spiral-glow]"),
            spiralLine: document.querySelector("[data-ophf-spiral-line]"),
            latest: document.querySelector("[data-ophf-latest]"),
            playAll: document.querySelector("[data-ophf-playall]"),
            trackCover: document.querySelector("[data-ophf-track-cover]"),
            shareSlot: document.querySelector("[data-ophf-share]"),
            trackTitle: document.querySelector("[data-ophf-track-title]"),
            versionMeta: document.querySelector("[data-ophf-version-meta]"),
            versionNav: document.querySelector("[data-ophf-version-nav]"),
            versionTitle: document.querySelector("[data-ophf-version-title]"),
            links: document.querySelector("[data-ophf-links]"),
            lyrics: document.querySelector("[data-ophf-lyrics]"),
            miniRail: document.querySelector("[data-ophf-mini-rail]"),
            navA: document.querySelector("[data-ophf-nav-a]"),
            navB: document.querySelector("[data-ophf-nav-b]"),
            navC: document.querySelector("[data-ophf-nav-c]")
        };

        const ophfState = {
            mode: "gallery",
            songId: "wellwolf",
            versionIndex: 0
        };
        const ophfLyricsCache = new Map();
        let ophfLyricsRequestId = 0;
        let ophfSpiralFrame = 0;
        let ophfMapResizeObserver = null;

        function ophfCoverUrl(song) {
            return `${ophfBasePath}${song.file}`;
        }

        function ophfVersionImageUrl(song, version) {
            return version.image || ophfCoverUrl(song);
        }

        async function ophfLoadLyrics(version) {
            const fallback = version.lyrics || "";
            if (!version.lyricsPath) return fallback;
            if (ophfLyricsCache.has(version.lyricsPath)) return ophfLyricsCache.get(version.lyricsPath);

            const response = await fetch(version.lyricsPath, { cache: "force-cache" });
            if (!response.ok) throw new Error(`Lyrics request failed: ${response.status}`);
            const text = await response.text();
            ophfLyricsCache.set(version.lyricsPath, text);
            return text;
        }

        function ophfGetSong(id) {
            return ophfSongs.find((song) => song.id === id) || ophfSongs[0];
        }

        function ophfGetLatestSong() {
            return ophfSongs.find((song) => song.latest) || ophfSongs[ophfSongs.length - 1];
        }

        function ophfSetImageFallback(img, song) {
            img.onerror = () => {
                img.onerror = null;
                img.style.display = "none";
                if (img.parentElement && !img.parentElement.querySelector(".ophf-songNodeFallback")) {
                    const fallback = document.createElement("span");
                    fallback.className = "ophf-songNodeFallback";
                    img.parentElement.appendChild(fallback);
                }
            };
        }

        function ophfGetSongLabelLines(song) {
            return song.labelLines && song.labelLines.length ? song.labelLines : [song.title];
        }

        function ophfSetCoverTitle(lines) {
            ophfEls.coverName.innerHTML = "";
            lines.forEach((line) => {
                const lineEl = document.createElement("span");
                lineEl.className = "ophf-coverNameLine";
                lineEl.textContent = line;
                ophfEls.coverName.appendChild(lineEl);
            });
        }

        function ophfCreateIconImg(src) {
            const icon = document.createElement("img");
            icon.className = "ophf-listenIcon";
            icon.src = src;
            icon.alt = "";
            return icon;
        }

        function ophfCreateShareIcon() {
            const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            icon.setAttribute("class", "ophf-listenIcon");
            icon.setAttribute("viewBox", "0 0 24 24");
            icon.setAttribute("aria-hidden", "true");

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("fill", "currentColor");
            path.setAttribute("d", "M15 5.25a3.75 3.75 0 1 0 1.58 7.15l-7.02 3.5a3.75 3.75 0 1 0 .67 1.34l7.02-3.5a3.75 3.75 0 1 0-.67-1.34l-7.02 3.5a3.75 3.75 0 0 0 0-2.8l7.02-3.5A3.74 3.74 0 0 0 15 5.25Z");
            icon.appendChild(path);

            return icon;
        }

        function ophfVersionMixBackground(version) {
            const colors = Array.isArray(version.mixColors) ? version.mixColors.filter(Boolean) : [];
            if (!colors.length) return "#ffffff";
            if (colors.length === 1) return colors[0];
            return `linear-gradient(135deg, ${colors.join(", ")})`;
        }

        function ophfCreateVersionJump(direction, targetVersion, targetIndex) {
            const btn = document.createElement("button");
            btn.className = "ophf-versionJump";
            btn.type = "button";
            btn.setAttribute("aria-label", `${direction < 0 ? "Previous" : "Next"} version`);
            btn.addEventListener("click", () => ophfOpenSong(ophfState.songId, targetIndex));

            const glyph = document.createElement("span");
            glyph.className = "ophf-versionJumpGlyph";
            glyph.textContent = direction < 0 ? "<" : ">";

            const swatch = document.createElement("span");
            swatch.className = "ophf-versionJumpSwatch";
            swatch.style.background = ophfVersionMixBackground(targetVersion);

            if (direction < 0) {
                btn.appendChild(glyph);
                btn.appendChild(swatch);
            } else {
                btn.appendChild(swatch);
                btn.appendChild(glyph);
            }

            return btn;
        }

        function ophfRenderMap() {
            ophfEls.mapGrid.innerHTML = "";

            ophfSongs
                .slice()
                .sort((a, b) => a.journey - b.journey)
                .forEach((song) => {
                    const cell = document.createElement("div");
                    cell.className = "ophf-mapCell";
                    cell.dataset.ophfSongId = song.id;
                    cell.style.gridRow = song.grid[0];
                    cell.style.gridColumn = song.grid[1];

                    const node = document.createElement("button");
                    node.className = "ophf-songNode";
                    node.type = "button";
                    node.setAttribute("aria-label", `Open ${song.title}`);
                    node.addEventListener("click", () => ophfOpenSong(song.id));

                    const img = document.createElement("img");
                    img.className = "ophf-songNodeImg";
                    img.src = ophfCoverUrl(song);
                    img.alt = "";
                    ophfSetImageFallback(img, song);

                    const label = document.createElement("div");
                    label.className = "ophf-songLabel";
                    (song.labelLines || [song.title]).forEach((line) => {
                        const lineEl = document.createElement("span");
                        lineEl.className = "ophf-songLabelLine";
                        lineEl.textContent = line;
                        label.appendChild(lineEl);
                    });

                    const crop = document.createElement("span");
                    crop.className = "ophf-nodeArtCrop";
                    crop.appendChild(img);

                    node.appendChild(crop);
                    const unit = document.createElement("div");
                    unit.className = "ophf-songUnit";

                    unit.appendChild(node);
                    unit.appendChild(label);
                    cell.appendChild(unit);
                    ophfEls.mapGrid.appendChild(cell);
                });

            ophfScheduleSpiralUpdate();
        }

        function ophfScheduleSpiralUpdate() {
            if (ophfSpiralFrame) return;
            ophfSpiralFrame = requestAnimationFrame(() => {
                ophfSpiralFrame = 0;
                ophfUpdateSpiral();
            });
        }

        function ophfUpdateSpiral() {
            if (!ophfEls.songField || !ophfEls.spiralSvg || !ophfEls.spiralLine || !ophfEls.spiralGlow) return;

            const fieldRect = ophfEls.songField.getBoundingClientRect();
            if (!fieldRect.width || !fieldRect.height) return;

            const ordered = ophfSongs.slice().sort((a, b) => a.journey - b.journey);
            const points = ordered
                .map((song) => {
                    const cell = ophfEls.mapGrid.querySelector(`[data-ophf-song-id="${song.id}"]`);
                    const node = cell ? cell.querySelector(".ophf-songNode") : null;
                    if (!node) return null;

                    const nodeRect = node.getBoundingClientRect();
                    return {
                        x: nodeRect.left - fieldRect.left + nodeRect.width / 2,
                        y: nodeRect.top - fieldRect.top + nodeRect.height / 2
                    };
                })
                .filter(Boolean);

            if (points.length < 2) return;

            const d = points
                .map((point, index) => `${index === 0 ? "M" : "L"} ${point.x.toFixed(2)} ${point.y.toFixed(2)}`)
                .join(" ");
            const width = fieldRect.width.toFixed(2);
            const height = fieldRect.height.toFixed(2);
            const first = points[0];
            const last = points[points.length - 1];

            ophfEls.spiralSvg.setAttribute("viewBox", `0 0 ${width} ${height}`);
            ophfEls.spiralGlow.setAttribute("d", d);
            ophfEls.spiralLine.setAttribute("d", d);

            if (ophfEls.spiralGradient) {
                ophfEls.spiralGradient.setAttribute("x1", first.x.toFixed(2));
                ophfEls.spiralGradient.setAttribute("y1", first.y.toFixed(2));
                ophfEls.spiralGradient.setAttribute("x2", last.x.toFixed(2));
                ophfEls.spiralGradient.setAttribute("y2", last.y.toFixed(2));
            }
        }

        function ophfRenderRail() {
            ophfEls.miniRail.innerHTML = "";

            ophfSongs
                .slice()
                .sort((a, b) => a.journey - b.journey)
                .forEach((song) => {
                    const btn = document.createElement("button");
                    btn.className = "ophf-railBtn";
                    btn.type = "button";
                    btn.setAttribute("aria-label", song.title);
                    btn.setAttribute("aria-current", song.id === ophfState.songId ? "true" : "false");
                    btn.addEventListener("click", () => ophfOpenSong(song.id));

                    const img = document.createElement("img");
                    img.className = "ophf-railImg";
                    img.src = ophfCoverUrl(song);
                    img.alt = "";
                    ophfSetImageFallback(img, song);

                    const crop = document.createElement("span");
                    crop.className = "ophf-nodeArtCrop";
                    crop.appendChild(img);

                    btn.appendChild(crop);
                    ophfEls.miniRail.appendChild(btn);
                });
        }

        function ophfRenderLinks(version) {
            ophfEls.links.innerHTML = "";

            const strip = document.createElement("div");
            strip.className = "ophf-listenStrip";

            ophfPlatforms.forEach((name) => {
                const a = document.createElement("a");
                a.className = "ophf-listenBtn";
                a.href = version.links[name] || "#";
                a.setAttribute("aria-label", `${name} link`);
                a.appendChild(ophfCreateIconImg(ophfPlatformIcons[name]));
                strip.appendChild(a);
            });

            ophfEls.links.appendChild(strip);
        }

        async function ophfRenderDetail() {
            const song = ophfGetSong(ophfState.songId);
            const version = song.versions[ophfState.versionIndex] || song.versions[0];
            const requestId = ++ophfLyricsRequestId;

            ophfEls.trackCover.src = ophfVersionImageUrl(song, version);
            ophfEls.trackCover.alt = `${song.title} cover`;
            ophfEls.trackTitle.textContent = "";
            ophfEls.versionTitle.textContent = version.title;
            ophfEls.lyrics.textContent = "Loading lyrics...";

            if (song.versions.length <= 1) {
                ophfEls.versionMeta.textContent = "Opa & Only version";
            } else {
                ophfEls.versionMeta.textContent = `Version ${ophfState.versionIndex + 1}/${song.versions.length}`;
            }

            ophfEls.versionNav.innerHTML = "";
            if (song.versions.length > 1) {
                if (ophfState.versionIndex > 0) {
                    ophfEls.versionNav.appendChild(
                        ophfCreateVersionJump(-1, song.versions[ophfState.versionIndex - 1], ophfState.versionIndex - 1)
                    );
                }
                if (ophfState.versionIndex < song.versions.length - 1) {
                    ophfEls.versionNav.appendChild(
                        ophfCreateVersionJump(1, song.versions[ophfState.versionIndex + 1], ophfState.versionIndex + 1)
                    );
                }
            }

            ophfEls.shareSlot.innerHTML = "";
            const share = document.createElement("button");
            share.className = "ophf-shareBtn";
            share.type = "button";
            share.setAttribute("aria-label", "Share");
            share.appendChild(ophfCreateShareIcon());
            share.addEventListener("click", ophfShareCurrent);
            ophfEls.shareSlot.appendChild(share);

            ophfRenderLinks(version);
            ophfRenderRail();
            ophfRenderCover(song);

            try {
                const lyrics = await ophfLoadLyrics(version);
                if (requestId === ophfLyricsRequestId) {
                    ophfEls.lyrics.textContent = lyrics || version.lyrics || "";
                }
            } catch {
                if (requestId === ophfLyricsRequestId) {
                    ophfEls.lyrics.textContent = version.lyrics || "";
                }
            }
        }

        function ophfRenderCover(song = null) {
            if (ophfState.mode === "gallery") {
                ophfEls.coverImg.src = ophfHeroCover;
                ophfEls.coverImg.style.display = "block";
                ophfEls.coverKicker.textContent = "Gallery Map";
                ophfSetCoverTitle(["OPAHiFi Journey"]);
                if (ophfEls.coverPill) ophfEls.coverPill.textContent = "3x3 Map";
                return;
            }

            const activeSong = song || ophfGetSong(ophfState.songId);
            ophfEls.coverImg.src = ophfCoverUrl(activeSong);
            ophfEls.coverImg.style.display = "block";
            ophfEls.coverKicker.textContent = "Now Viewing";
            ophfSetCoverTitle(ophfGetSongLabelLines(activeSong));
            if (ophfEls.coverPill) ophfEls.coverPill.textContent = `Song ${activeSong.journey}`;
        }

        function ophfSetBottomNav() {
            const isGallery = ophfState.mode === "gallery";
            ophfEls.navA.textContent = isGallery ? "Videos" : "Prev";
            ophfEls.navB.textContent = isGallery ? "Gallery" : "Home";
            ophfEls.navC.textContent = isGallery ? "About" : "Next";
            ophfEls.navB.classList.toggle("ophf-bottomBtnActive", isGallery);
        }

        function ophfOpenGallery() {
            ophfState.mode = "gallery";
            ophfEls.app.dataset.ophfMode = "gallery";
            ophfRenderCover();
            ophfSetBottomNav();
            ophfScheduleSpiralUpdate();
        }

        function ophfOpenSong(songId, versionIndex = 0) {
            ophfState.mode = "detail";
            ophfState.songId = songId;
            ophfState.versionIndex = versionIndex;
            ophfEls.app.dataset.ophfMode = "detail";
            ophfRenderDetail();
            ophfSetBottomNav();
        }

        function ophfMoveSong(direction) {
            const ordered = ophfSongs.slice().sort((a, b) => a.journey - b.journey);
            const currentIndex = ordered.findIndex((song) => song.id === ophfState.songId);
            const nextIndex = (currentIndex + direction + ordered.length) % ordered.length;
            ophfOpenSong(ordered[nextIndex].id);
        }

        function ophfShareCurrent() {
            const song = ophfGetSong(ophfState.songId);
            const shareData = {
                title: `OPAHiFi — ${song.title}`,
                text: `Listen to ${song.title} on OPAHiFi`,
                url: `${location.origin}${location.pathname}#${song.id}`
            };

            if (navigator.share) {
                navigator.share(shareData).catch(() => { });
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(shareData.url);
            }
        }

        function ophfBindEvents() {
            ophfEls.latest.addEventListener("click", () => ophfOpenSong(ophfGetLatestSong().id));
            ophfEls.playAll.addEventListener("click", () => ophfOpenSong(ophfPlaylistOrder[0]));

            ophfEls.navA.addEventListener("click", () => {
                if (ophfState.mode === "detail") ophfMoveSong(-1);
            });

            ophfEls.navB.addEventListener("click", () => {
                if (ophfState.mode === "detail") ophfOpenGallery();
            });

            ophfEls.navC.addEventListener("click", () => {
                if (ophfState.mode === "detail") ophfMoveSong(1);
            });

            window.addEventListener("resize", ophfScheduleSpiralUpdate);

            if ("ResizeObserver" in window && ophfEls.songField) {
                ophfMapResizeObserver = new ResizeObserver(ophfScheduleSpiralUpdate);
                ophfMapResizeObserver.observe(ophfEls.songField);
            }
        }

        function ophfInit() {
            ophfRenderMap();
            ophfRenderRail();
            ophfBindEvents();
            ophfSetBottomNav();
            ophfRenderCover();

            const hashId = location.hash.replace("#", "");
            if (hashId && ophfSongs.some((song) => song.id === hashId)) {
                ophfOpenSong(hashId);
            }
        }

        ophfInit();
    </script>
</body>
