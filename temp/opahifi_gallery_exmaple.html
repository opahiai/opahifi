<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpaHiFi Gallery</title>
    
    <!-- Fonts and Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- GSAP Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Flip.min.js"></script>

    <style>
        :root {
            /* Color Palette */
            --navy-900: #06090e;
            --navy-800: #0c121d;
            --navy-700: #151f30;
            --navy-bg-alpha: rgba(6, 9, 14, 0.8);
            
            --cyan-300: #67e8f9;
            --cyan-400: #22d3ee;
            --cyan-600: #0891b2;
            --cyan-900: #164e63;
            
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            
            --spotify: #1DB954;
            --apple: #ffffff;
            --youtube: #FF0000;
            --soundcloud: #FF5500;

            /* Spacing & Sizes */
            --nav-height: 64px;
            --rail-height: 80px;
        }

        @media (min-width: 640px) {
            :root {
                --rail-height: 96px;
            }
        }

        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--navy-900);
            color: var(--text-main);
            min-height: 100dvh;
            overflow-x: hidden;
        }
        
        body.modal-open {
            overflow: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--navy-900); 
        }
        ::-webkit-scrollbar-thumb {
            background: var(--navy-700); 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2a3b5a; 
        }
        
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            height: var(--nav-height);
            background-color: rgba(6, 9, 14, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--navy-700);
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .nav-logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(to bottom right, var(--cyan-400), #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(34, 211, 238, 0.2);
        }

        .nav-logo-icon i {
            color: white;
            font-size: 0.75rem;
            margin-left: 2px;
        }

        .nav-title {
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.025em;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: var(--navy-800);
            color: var(--text-muted);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background-color: var(--navy-700);
            color: white;
        }

        .icon-btn:disabled {
            opacity: 0.2;
            cursor: default;
            pointer-events: none;
        }

        .gallery-main {
            padding-top: var(--nav-height);
            padding-bottom: 1rem;
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            width: 100%;
            max-width: 400px;
            padding: 0.5rem;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .song-cover {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: pointer;
            transform-origin: center;
            transition: transform 0.2s ease, border-radius 0.4s ease;
            z-index: 10;
        }

        .song-cover.is-circle {
            border-radius: 50%;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        .song-cover.is-circle.hover-scale:hover {
            transform: scale(1.03);
        }

        .song-cover.is-circle.hover-scale:active {
            transform: scale(0.95);
        }

        .song-cover.is-rounded {
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .song-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s ease, opacity 0.3s ease;
        }

        .song-cover:hover img {
            transform: scale(1.1);
        }

        .cover-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.4), transparent);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 0.75rem;
        }

        .cover-title {
            color: white;
            font-weight: 700;
            font-size: 10px;
            text-align: center;
            padding: 0 0.25rem;
            line-height: 1.2;
        }

        .version-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            z-index: 0;
            background-color: rgba(22, 78, 99, 0.9);
            backdrop-filter: blur(4px);
            color: var(--cyan-300);
            font-size: 8px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 9999px;
            border: 1px solid rgba(21, 31, 48, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .detail-view {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            pointer-events: none;
        }

        .detail-bg {
            position: absolute;
            inset: 0;
            background-color: var(--navy-900);
            opacity: 0;
            z-index: -10;
        }

        .detail-header {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            padding-top: 2rem;
            background-color: rgba(6, 9, 14, 0.9);
            backdrop-filter: blur(8px);
            z-index: 10;
            opacity: 0;
        }

        @media (min-width: 640px) {
            .detail-header { padding-top: 1rem; }
        }

        .now-playing-label {
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .detail-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 1rem;
            padding-bottom: calc(var(--rail-height) + 1rem);
        }

        .detail-content {
            max-width: 28rem;
            margin: 0 auto;
            width: 100%;
            padding: 1rem 0 2rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-section {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .hero-slot {
            width: 6rem;
            height: 6rem;
            flex-shrink: 0;
            position: relative;
            z-index: 50;
            perspective: 1000px;
        }

        @media (min-width: 640px) {
            .hero-slot {
                width: 7rem;
                height: 7rem;
            }
        }

        .song-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            opacity: 0;
        }

        .song-info h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.375rem;
            letter-spacing: -0.025em;
            line-height: 1.2;
        }

        @media (min-width: 640px) {
            .song-info h1 { font-size: 1.875rem; }
        }

        .info-meta {
            display: flex;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        .version-navigator {
            width: 100%;
            min-height: 48px;
            margin-bottom: 1.5rem;
            opacity: 0;
        }

        .version-nav-flex {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            background-color: rgba(6, 9, 14, 0.6);
            border: 1px solid var(--navy-700);
            padding: 0.375rem;
            border-radius: 9999px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
        }
        
        .version-nav-flex .icon-btn {
            width: 32px;
            height: 32px;
            background-color: transparent;
        }

        .version-nav-flex .icon-btn:hover:not(:disabled) {
            background-color: var(--navy-700);
        }

        .pill-container {
            flex: 1;
            overflow-x: auto;
            position: relative;
            display: flex;
            gap: 0.375rem;
            scroll-snap-type: x mandatory;
            align-items: center;
        }

        .version-pill {
            padding: 0.4rem 1.25rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s ease;
            scroll-snap-align: center;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .version-pill.active {
            background-color: var(--cyan-600);
            color: white;
            box-shadow: 0 4px 14px rgba(8, 145, 178, 0.3);
        }

        .version-pill.inactive {
            background-color: var(--navy-800);
            color: var(--text-muted);
            border-color: var(--navy-700);
        }

        .version-pill.inactive:hover {
            background-color: var(--navy-700);
        }

        .platform-links {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            opacity: 0;
        }

        .platform-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid;
            transition: all 0.2s ease;
            cursor: pointer;
            font-size: 1.125rem;
        }

        .lyrics-section {
            width: 100%;
            background-color: rgba(12, 18, 29, 0.5);
            border-radius: 1rem;
            padding: 1.25rem;
            border: 1px solid rgba(21, 31, 48, 0.5);
            opacity: 0;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .lyrics-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .lyrics-header h3 {
            font-size: 1.125rem;
            font-weight: 600;
            color: white;
        }

        .lyrics-header i {
            color: var(--text-muted);
        }

        .lyrics-text {
            color: #d1d5db;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            font-weight: 500;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }

        .lyrics-text.collapsed {
            max-height: 16rem;
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
            -webkit-mask-image: -webkit-linear-gradient(top, black 50%, transparent 100%);
        }

        .lyrics-text.expanded {
            max-height: 2000px;
            mask-image: none;
            -webkit-mask-image: none;
        }

        .lyrics-toggle {
            margin-top: 0.5rem;
            color: var(--cyan-400);
            font-size: 0.875rem;
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: left;
            padding: 0.5rem 0;
        }
        
        .lyrics-toggle:hover {
            color: var(--cyan-300);
        }

        .bottom-rail {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--rail-height);
            z-index: 50;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            gap: 1rem;
            pointer-events: none;
        }

        /* Scroll toggle classes for GSAP FLIP fix */
        .rail-scroll-on {
            overflow-x: auto;
        }
        .rail-scroll-off {
            overflow-x: visible;
        }

        .rail-bg {
            position: absolute;
            inset: 0;
            background-color: rgba(6, 9, 14, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--navy-700);
            opacity: 0;
            z-index: -10;
        }

        .rail-item-slot {
            width: 3rem;
            height: 3rem;
            flex-shrink: 0;
            position: relative;
            border-radius: 50%;
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }
        
        @media (min-width: 640px) {
            .rail-item-slot { width: 3.5rem; height: 3.5rem; }
        }

        .rail-item-slot:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">
            <div class="nav-logo-icon">
                <i class="fa-solid fa-play"></i>
            </div>
            <span class="nav-title">OpaHiFi</span>
        </div>
        <button class="icon-btn">
            <i class="fa-solid fa-bars"></i>
        </button>
    </nav>

    <!-- Main Gallery Grid -->
    <main class="gallery-main" id="gallery-container">
        <div id="gallery-grid" class="gallery-grid">
            <!-- Items populated by JS -->
        </div>
    </main>

    <!-- Full Screen Detail View -->
    <div id="detail-view" class="detail-view">
        <div id="detail-bg" class="detail-bg"></div>
        
        <!-- Detail Header -->
        <div class="detail-header detail-anim">
            <button onclick="closeSong()" class="icon-btn">
                <i class="fa-solid fa-chevron-down"></i>
            </button>
            <span class="now-playing-label">Now Playing</span>
            <button class="icon-btn">
                <i class="fa-solid fa-arrow-up-from-bracket"></i>
            </button>
        </div>

        <!-- Scrollable Content -->
        <div class="detail-scroll-area no-scrollbar" id="detail-scroll-area">
            <div class="detail-content">
                
                <!-- Hero Info Header -->
                <div class="hero-section">
                    <div id="detail-hero-slot" class="hero-slot">
                        <!-- Flipped element injected here -->
                    </div>

                    <div class="song-info detail-anim" id="detail-info">
                        <h1 id="detail-title">Song Title</h1>
                        <div class="info-meta">
                            <i class="fa-regular fa-clock" style="margin-right: 6px; opacity: 0.7;"></i>
                            <span id="detail-length">3:45</span>
                        </div>
                    </div>
                </div>

                <!-- Version Navigator -->
                <div class="version-navigator detail-anim" id="version-navigator">
                    <div class="version-nav-flex">
                        <button id="prev-version-btn" onclick="prevVersion()" class="icon-btn" style="flex-shrink:0;">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <div class="pill-container no-scrollbar" id="version-pills">
                            <!-- Pills go here -->
                        </div>
                        <button id="next-version-btn" onclick="nextVersion()" class="icon-btn" style="flex-shrink:0;">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Platform Links -->
                <div class="platform-links detail-anim" id="platform-links">
                    <!-- Links populated by JS -->
                </div>

                <!-- Lyrics Section -->
                <div class="lyrics-section detail-anim">
                    <div class="lyrics-header">
                        <h3>Lyrics</h3>
                        <i class="fa-solid fa-microphone-lines"></i>
                    </div>
                    <div id="lyrics-container">
                        <div id="lyrics-text" class="lyrics-text collapsed">
                            <!-- Lyrics go here -->
                        </div>
                        <button onclick="toggleLyrics()" id="lyrics-toggle-btn" class="lyrics-toggle">
                            Show More
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Always-present Invisible Rail -->
    <div id="bottom-rail" class="bottom-rail rail-scroll-on no-scrollbar">
        <div id="bottom-rail-bg" class="rail-bg"></div>
        <!-- Rail Item Slots populated by JS -->
    </div>

    <script>
        gsap.registerPlugin(Flip);

        const songsData = [
            {

            { id: 4, title: "Opa pa pa party", versions: [{ name: "Standard", cover: "https://opahifi.com/img/music/base/base-opapapaparty.png", length: "3:10", platforms: ["spotify", "apple"], lyrics: "Turn the speakers to the max\nLeave the worries in our tracks\nOpa pa pa party all night long\nLiving inside of this song." }] },

            { id: 6, title: "Splenda Love Rabbit Hell", versions: [{ name: "Standard", cover: "https://opahifi.com/img/music/base/base-splendaloverabbithell.png", length: "2:50", platforms: ["apple", "soundcloud"], lyrics: "Sweet like splenda, down the rabbit hole\nLosing grip upon my soul\nArtificial sugar high\nKissing sanity goodbye." }] },
            { id: 7, title: "Believe the Truth fairy", versions: [{ name: "Standard", cover: "https://opahifi.com/img/music/base/base-believethetruthfairy.png", length: "3:40", platforms: ["spotify", "apple", "youtube"], lyrics: "Sprinkling truth like fairy dust\nIn this magic we must trust\nOpen up your heavy eyes\nSee beyond the little lies." }] },
            { id: 8, title: "Yeah, Let's Do Brunch", versions: [{ name: "Standard", cover: "https://opahifi.com/img/music/base/base-yeahletsdobrunch.png", length: "3:25", platforms: ["spotify"], lyrics: "Mimosas pouring, the weekend's here\nClinking glasses, spreading cheer\nAvocado on the toast\nWe're doing the absolute most." }] },

            {
                id: 10,
                title: "Cyber Heart",
                versions: [
                    { name: "Club Mix", cover: "https://opahifi.com/images/cyber-heart-club.jpg", length: "5:12", platforms: ["spotify", "soundcloud", "youtube"], lyrics: "Pumping bass and wires crossed\nIn this club we're getting lost\nCyber heart is beating fast\nMake this simulation last.\n\n(Drop)" },
                    { name: "Lofi Edit", cover: "https://opahifi.com/images/cyber-heart-lofi.jpg", length: "2:45", platforms: ["spotify", "youtube"], lyrics: "(Static and gentle beats)\nCyber heart is beating slow\nNowhere else we need to go..." }

        ];

        // Platform CSS mappings (Replacing Tailwind utilities with inline styles)
        const platformConfig = {
            spotify: { icon: "fa-brands fa-spotify", color: "var(--spotify)", bg: "rgba(29,185,84,0.1)", border: "rgba(29,185,84,0.3)" },
            apple: { icon: "fa-brands fa-apple", color: "var(--apple)", bg: "rgba(255,255,255,0.1)", border: "rgba(255,255,255,0.3)" },
            youtube: { icon: "fa-brands fa-youtube", color: "var(--youtube)", bg: "rgba(255,0,0,0.1)", border: "rgba(255,0,0,0.3)" },
            soundcloud: { icon: "fa-brands fa-soundcloud", color: "var(--soundcloud)", bg: "rgba(255,85,0,0.1)", border: "rgba(255,85,0,0.3)" }
        };

        // State variables
        let activeSongId = null;
        let activeVersionIndex = 0;
        let isAnimating = false;
        let isLyricsExpanded = false;

        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            const rail = document.getElementById('bottom-rail');
            
            // Clean up to keep only the background div in the rail
            grid.innerHTML = '';
            const railBg = document.getElementById('bottom-rail-bg');
            rail.innerHTML = '';
            rail.appendChild(railBg);

            songsData.forEach(song => {
                const mainVersion = song.versions[0];
                const versionCount = song.versions.length;
                
                // 1. Grid Item (Contains movable cover initially)
                const gridHtml = `
                    <div id="gallery-item-${song.id}" class="gallery-item">
                        <div id="cover-${song.id}" class="song-cover is-circle hover-scale" onclick="handleCoverClick(${song.id})">
                            <img src="${mainVersion.cover}" id="img-${song.id}" alt="${song.title}" onerror="this.onerror=null; this.src='https://placehold.co/800x800/151f30/67e8f9?text=${encodeURIComponent(song.title)}';">
                            <div class="cover-gradient">
                                <span class="cover-title">${song.title}</span>
                            </div>
                            ${versionCount > 1 ? `<div class="version-badge">${versionCount}v</div>` : ''}
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', gridHtml);

                // 2. Rail Item Slot
                const railSlotHtml = `
                    <div id="rail-item-slot-${song.id}" class="rail-item-slot"></div>
                `;
                rail.insertAdjacentHTML('beforeend', railSlotHtml);
            });
        }

        function handleCoverClick(id) {
            if (isAnimating) return;
            if (activeSongId === null) {
                openSong(id);
            } else if (activeSongId !== id) {
                changeSongFromRail(id);
            }
        }

        function updateDetailContent(song, versionIndex) {
            const version = song.versions[versionIndex];
            
            document.getElementById('detail-title').innerText = song.title;
            document.getElementById('detail-length').innerText = version.length;
            
            const activeImg = document.getElementById(`img-${song.id}`);
            if (activeImg) {
                activeImg.src = version.cover;
            }

            const pillsContainer = document.getElementById('version-pills');
            pillsContainer.innerHTML = '';
            
            // Always display the navigator to prevent layout shifts
            document.getElementById('version-navigator').style.display = 'block';

            song.versions.forEach((v, idx) => {
                const isActive = idx === versionIndex;
                const className = isActive ? 'version-pill active' : 'version-pill inactive';
                const pillHtml = `
                    <button onclick="changeVersion(${idx})" class="${className}">
                        ${v.name}
                    </button>
                `;
                pillsContainer.insertAdjacentHTML('beforeend', pillHtml);
            });

            // Update disabled states for navigation arrows
            const prevBtn = document.getElementById('prev-version-btn');
            const nextBtn = document.getElementById('next-version-btn');
            if (prevBtn && nextBtn) {
                prevBtn.disabled = versionIndex === 0;
                nextBtn.disabled = versionIndex === song.versions.length - 1;
            }

            const linksContainer = document.getElementById('platform-links');
            linksContainer.innerHTML = '';
            version.platforms.forEach(platform => {
                const pData = platformConfig[platform];
                if(pData) {
                    const btn = `
                        <button class="platform-btn" style="background-color:${pData.bg}; border-color:${pData.border}; color:${pData.color}"
                                onmouseover="this.style.backgroundColor='${pData.border}'" 
                                onmouseout="this.style.backgroundColor='${pData.bg}'">
                            <i class="${pData.icon}"></i>
                        </button>
                    `;
                    linksContainer.insertAdjacentHTML('beforeend', btn);
                }
            });

            document.getElementById('lyrics-text').innerText = version.lyrics;
            resetLyricsToggle();
        }

        function openSong(id) {
            if (isAnimating) return;
            isAnimating = true;
            
            activeSongId = id;
            activeVersionIndex = 0;
            const song = songsData.find(s => s.id === id);
            
            updateDetailContent(song, 0);

            const detailView = document.getElementById('detail-view');
            const bottomRail = document.getElementById('bottom-rail');
            const heroSlot = document.getElementById('detail-hero-slot');

            // Toggle overflow to prevent clipping during flight
            bottomRail.classList.remove('rail-scroll-on');
            bottomRail.classList.add('rail-scroll-off');

            const state = Flip.getState('.song-cover');

            detailView.style.pointerEvents = 'auto';
            document.body.classList.add('modal-open');
            
            gsap.to('#detail-bg', { opacity: 1, duration: 0.4 });
            gsap.to('#bottom-rail-bg', { opacity: 1, duration: 0.4 });
            bottomRail.style.pointerEvents = 'auto';

            songsData.forEach(s => {
                const cover = document.getElementById(`cover-${s.id}`);
                const railSlot = document.getElementById(`rail-item-slot-${s.id}`);
                
                gsap.to(cover.querySelectorAll('.cover-gradient, .version-badge'), { opacity: 0, duration: 0.2 });

                if (s.id === id) {
                    heroSlot.appendChild(cover);
                    cover.classList.remove('is-circle', 'hover-scale');
                    cover.classList.add('is-rounded');
                    railSlot.style.display = 'none';
                } else {
                    railSlot.appendChild(cover);
                    railSlot.style.display = 'block';
                    cover.classList.remove('hover-scale');
                }
            });

            Flip.from(state, {
                duration: 0.8,
                ease: "back.out(1.1)",
                absolute: true,
                zIndex: 9999,
                nested: true,
                stagger: 0.03,
                onComplete: () => { 
                    isAnimating = false; 
                    // Restore overflow after landing
                    bottomRail.classList.remove('rail-scroll-off');
                    bottomRail.classList.add('rail-scroll-on');
                }
            });

            gsap.fromTo(`#cover-${id}`, { rotationY: 0 }, { rotationY: 360, duration: 0.8, ease: "power2.inOut" });

            gsap.fromTo('.detail-anim', 
                { y: 20, opacity: 0 }, 
                { y: 0, opacity: 1, duration: 0.5, stagger: 0.05, ease: "power3.out", delay: 0.3 }
            );
        }

        function closeSong() {
            if (isAnimating) return;
            isAnimating = true;

            const detailView = document.getElementById('detail-view');
            const bottomRail = document.getElementById('bottom-rail');
            
            bottomRail.classList.remove('rail-scroll-on');
            bottomRail.classList.add('rail-scroll-off');

            const state = Flip.getState('.song-cover');

            songsData.forEach(s => {
                const cover = document.getElementById(`cover-${s.id}`);
                const gridSlot = document.getElementById(`gallery-item-${s.id}`);
                
                gridSlot.appendChild(cover);
                
                if (s.id === activeSongId) {
                    cover.classList.remove('is-rounded');
                    cover.classList.add('is-circle', 'hover-scale');
                } else {
                    cover.classList.add('hover-scale');
                }
            });

            Flip.from(state, {
                duration: 0.7,
                ease: "power3.inOut",
                absolute: true,
                zIndex: 9999,
                nested: true,
                stagger: -0.02,
                onComplete: () => {
                    detailView.style.pointerEvents = 'none';
                    document.body.classList.remove('modal-open');
                    bottomRail.style.pointerEvents = 'none';
                    
                    bottomRail.classList.remove('rail-scroll-off');
                    bottomRail.classList.add('rail-scroll-on');
                    
                    activeSongId = null;
                    isAnimating = false;
                }
            });

            gsap.to('.cover-gradient, .version-badge', { opacity: 1, duration: 0.4, delay: 0.3 });
            gsap.to('#detail-bg', { opacity: 0, duration: 0.6 });
            gsap.to('#bottom-rail-bg', { opacity: 0, duration: 0.6 });

            gsap.fromTo(`#cover-${activeSongId}`, { rotationY: 360 }, { rotationY: 0, duration: 0.7, ease: "power3.inOut" });
            gsap.to('.detail-anim', { y: 10, opacity: 0, duration: 0.3, stagger: -0.04, ease: "power2.in" });
        }

        function changeSongFromRail(newId) {
            if (newId === activeSongId || isAnimating) return;
            isAnimating = true;

            const oldId = activeSongId;
            const song = songsData.find(s => s.id === newId);
            const bottomRail = document.getElementById('bottom-rail');
            
            document.getElementById('detail-scroll-area').scrollTop = 0;
            
            bottomRail.classList.remove('rail-scroll-on');
            bottomRail.classList.add('rail-scroll-off');

            const oldCover = document.getElementById(`cover-${oldId}`);
            const oldRailSlot = document.getElementById(`rail-item-slot-${oldId}`);
            const newCover = document.getElementById(`cover-${newId}`);
            const newRailSlot = document.getElementById(`rail-item-slot-${newId}`);
            const heroSlot = document.getElementById('detail-hero-slot');

            gsap.to('.detail-anim:not(.detail-header)', {
                opacity: 0,
                duration: 0.2,
                onComplete: () => {
                    updateDetailContent(song, 0);
                    gsap.to('.detail-anim:not(.detail-header)', { opacity: 1, duration: 0.3 });
                }
            });

            const state = Flip.getState('.song-cover');
            
            oldRailSlot.appendChild(oldCover);
            oldRailSlot.style.display = 'block'; 
            oldCover.classList.remove('is-rounded');
            oldCover.classList.add('is-circle');
            
            heroSlot.appendChild(newCover);
            newRailSlot.style.display = 'none';
            newCover.classList.remove('is-circle');
            newCover.classList.add('is-rounded');
            
            activeSongId = newId;
            activeVersionIndex = 0;
            
            oldRailSlot.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

            Flip.from(state, {
                duration: 0.8,
                ease: "back.out(1.1)",
                absolute: true,
                zIndex: 9999,
                nested: true,
                onComplete: () => { 
                    isAnimating = false; 
                    bottomRail.classList.remove('rail-scroll-off');
                    bottomRail.classList.add('rail-scroll-on');
                }
            });
            
            gsap.fromTo(oldCover, { rotationY: 360 }, { rotationY: 0, duration: 0.8, ease: "power2.inOut" });
            gsap.fromTo(newCover, { rotationY: 0 }, { rotationY: 360, duration: 0.8, ease: "power2.inOut" });
        }

        function changeVersion(index) {
            const song = songsData.find(s => s.id === activeSongId);
            if (index < 0 || index >= song.versions.length || index === activeVersionIndex) return;
            
            activeVersionIndex = index;
            const newVersion = song.versions[index];
            
            gsap.to(['#detail-info', '#platform-links'], {
                opacity: 0,
                duration: 0.2,
                onComplete: () => {
                    updateDetailContent(song, activeVersionIndex);
                    gsap.to(['#detail-info', '#platform-links'], { opacity: 1, duration: 0.3 });
                }
            });

            const activeImg = document.getElementById(`img-${song.id}`);
            if (activeImg) {
                gsap.to(activeImg, {
                    opacity: 0.4,
                    duration: 0.2,
                    onComplete: () => {
                        activeImg.src = newVersion.cover;
                        activeImg.onerror = function() {
                            this.onerror = null;
                            this.src = `https://placehold.co/800x800/151f30/67e8f9?text=${encodeURIComponent(newVersion.name)}`;
                        };
                        gsap.to(activeImg, { opacity: 1, duration: 0.3 });
                    }
                });
            }
        }

        function prevVersion() { changeVersion(activeVersionIndex - 1); }
        function nextVersion() { changeVersion(activeVersionIndex + 1); }

        function toggleLyrics() {
            const text = document.getElementById('lyrics-text');
            const btn = document.getElementById('lyrics-toggle-btn');
            
            if (!isLyricsExpanded) {
                text.classList.remove('collapsed');
                text.classList.add('expanded');
                btn.innerText = "Show Less";
                isLyricsExpanded = true;
            } else {
                text.classList.remove('expanded');
                text.classList.add('collapsed');
                btn.innerText = "Show More";
                isLyricsExpanded = false;
            }
        }

        function resetLyricsToggle() {
            const text = document.getElementById('lyrics-text');
            const btn = document.getElementById('lyrics-toggle-btn');
            text.classList.remove('expanded');
            text.classList.add('collapsed');
            btn.innerText = "Show More";
            isLyricsExpanded = false;
        }

        document.addEventListener('DOMContentLoaded', renderGallery);
    </script>
</body>
</html>
