<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OpaHiFi - The Organic Journey</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/journey.css">
  <link rel="stylesheet" href="css/universe.css">
</head>

<body>
  <div class="layout-wrapper" id="layout-wrapper">

    <!-- ── NAV ── -->
    <nav class="nav-area">
      OPAHIFI

      <button class="settings-btn" id="settings-btn" aria-label="Settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61
            l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81
            c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29
            L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58
            C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61
            l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54
            c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94
            l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z
            M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
      </button>

      <div class="settings-panel" id="settings-panel" role="dialog" aria-label="Orb size settings">
        <div class="settings-title">Orb Size</div>
        <div class="slider-container">
          <span class="slider-label">MIN</span>
          <input type="range" id="size-slider" min="0.5" max="1.5" step="0.1" value="1" aria-label="Orb size">
          <span class="slider-label">MAX</span>
        </div>
      </div>
    </nav>

    <!-- ── COVER ── -->
    <div class="cover-area" role="img" aria-label="OpaHiFi cover art"></div>

    <!-- ── JOURNEY MAP ── -->
    <main class="journey-container">
      <svg class="journey-svg" id="svg-layer" aria-hidden="true">
        <defs>
          <linearGradient id="spectrum-grad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#ff3b30"/>
            <stop offset="50%"  stop-color="#af52de"/>
            <stop offset="100%" stop-color="#007aff"/>
          </linearGradient>
        </defs>
        <path class="glow-line" id="glow-line" d=""/>
      </svg>

      <div class="nodes-wrapper" id="nodes-wrapper">

        <div class="journey-orb node-1" data-index="0" data-group-key="full-mindness" data-title="Full-Mindness">
          <div class="orb-img-crop"><div class="orb-img-wrapper">
            <img src="https://raw.githubusercontent.com/opahiai/opahifi/main/img/music/base/base-fullmindness.png" alt="Full Mindness">
          </div></div>
          <div class="orb-pill">Full-<br>Mindness</div>
        </div>

        <div class="journey-orb node-2" data-index="1" data-group-key="yeah-lets-do-brunch" data-title="Yeah Let's Do Brunch">
          <div class="orb-img-crop"><div class="orb-img-wrapper">
            <img src="https://raw.githubusercontent.com/opahiai/opahifi/main/img/music/base/base-yeahletsdobrunch.png" alt="Brunch">
          </div></div>
          <div class="orb-pill">Yeah, Let's<br>Do Brunch</div>
        </div>

        <div class="journey-orb node-3" data-index="2" data-group-key="hallucinating" data-title="Hallucinating Dum Dum">
          <div class="orb-img-crop"><div class="orb-img-wrapper">
            <img src="https://raw.githubusercontent.com/opahiai/opahifi/main/img/music/base/base-hallucinatingdumdum.png" alt="Dum Dum">
          </div></div>
          <div class="orb-pill">Hallucinating<br>Dum Dum</div>
        </div>

        <div class="journey-orb node-4" data-index="3" data-group-key="splenda-love-rabbit-hell" data-title="Splenda Love Rabbit Hell">
          <div class="orb-img-crop"><div class="orb-img-wrapper">
            <img src="https://raw.githubusercontent.com/opahiai/opahifi/main/img/music/base/base-splendaloverabbithell.png" alt="Splenda Love">
          </div></div>
          <div class="orb-pill">Splenda Love<br>Rabbit Hell</div>
        </div>

        <div class="journey-orb node-5" data-index="4" data-group-key="believe-the-truth-fairy" data-title="The Truth Fairy's">
          <div class="orb-img-crop"><div class="orb-img-wrapper">
            <img src="https://raw.githubusercontent.com/opahiai/opahifi/main/img/music/base/base-believethetruthfairy.png" alt="Truth Fairy">
          </div></div>
          <div class="orb-pill">The Truth<br>Fairy's</div>
        </div>

        <div class="journey-orb node-6" data-index="5" data-group-key="old-love-story" data-title="Old Love Story">
          <div class="orb-img-crop"><div class="orb-img-wrapper">
            <img src="https://raw.githubusercontent.com/opahiai/opahifi/main/img/music/base/base-oldlovestory.png" alt="Old Love Story">
          </div></div>
          <div class="orb-pill">Old Love<br>Story</div>
        </div>

        <div class="journey-orb node-7" data-index="6" data-group-key="glittaa-phoenix" data-title="Glittaa Phoenix">
          <div class="orb-img-crop"><div class="orb-img-wrapper">
            <img src="https://raw.githubusercontent.com/opahiai/opahifi/main/img/music/base/base-glittaaphoenix.png" alt="Glittaa Phoenix">
          </div></div>
          <div class="orb-pill">Glittaa<br>Phoenix</div>
        </div>

        <div class="journey-orb node-8" data-index="7" data-group-key="wellwolf-howl-lehluya" data-title="Wellwolf Howl-lehluya">
          <div class="orb-img-crop"><div class="orb-img-wrapper">
            <img src="https://raw.githubusercontent.com/opahiai/opahifi/main/img/music/base/base-wellwolfhowllehluya.png" alt="Wellwolf">
          </div></div>
          <div class="orb-pill">Wellwolf<br>Howl-lehluya</div>
        </div>

        <div class="journey-orb node-9" data-index="8" data-group-key="opa-pa-pa-party" data-title="Opa Pa Pa Party">
          <div class="orb-img-crop"><div class="orb-img-wrapper">
            <img src="https://raw.githubusercontent.com/opahiai/opahifi/main/img/music/base/base-opapapaparty.png" alt="Opa Party">
          </div></div>
          <div class="orb-pill">Opa Pa<br>Pa Party</div>
        </div>

      </div><!-- /nodes-wrapper -->

      <!-- Song thumbnail nav strip -->
      <div class="song-view-footer" id="song-view-footer">
        <div class="song-node-row" id="song-node-row" aria-label="Song navigation"></div>
      </div>

    </main>

    <!-- ── BOTTOM BAR ── -->
    <footer class="bottom-bar-container">

      <div class="map-tabs">
        <button class="menu-btn" id="map-left-btn">Videos</button>
        <button class="menu-btn active" id="map-center-btn">Gallery</button>
        <button class="menu-btn" id="map-right-btn">About</button>
      </div>

      <div class="carousel-indicator" id="carousel-indicator">
        <div class="carousel-dot active"></div>
        <div class="carousel-dot"></div>
        <div class="carousel-dot"></div>
      </div>

      <div class="universe-tabs">
        <button class="nav-arrow-btn" id="nav-back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg>
          <span id="nav-back-text">HUB</span>
        </button>
        <button class="nav-arrow-btn" id="nav-home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>HOME</span>
        </button>
        <button class="nav-arrow-btn" id="nav-next">
          <span id="nav-next-text">NEXT</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
        </button>
      </div>

    </footer>

    <!-- ── UNIVERSE OVERLAY ── -->
    <div class="universe-underlay" id="universe-underlay">
      <div class="universe-underlay-img" id="universe-underlay-img"></div>
      <div class="universe-underlay-overlay"></div>
    </div>

    <div class="universe-slider-viewport">
      <div class="universe-slider" id="universe-slider">

        <!-- Slide 0: Welcome -->
        <div class="universe-slide">
          <div class="slide-1-content">
            <div class="universe-intro">
              <div class="intro-welcome">WELCOME</div>
              <div class="intro-sub">TO THE UNIVERSE OF:</div>
            </div>
            <div class="universe-crisp-art" id="universe-crisp-art"></div>
          </div>
        </div>

        <!-- Slide 1: Lyrics -->
        <div class="universe-slide">
          <div class="glass-panel" id="universe-lyrics">
            <!-- Populated dynamically by script.js / musicData -->
          </div>
        </div>

        <!-- Slide 2: Stats -->
        <div class="universe-slide">
          <div class="glass-panel infographic" id="universe-stats">
            <!-- Populated dynamically by script.js / musicData -->
          </div>
        </div>

      </div>
    </div>

  </div><!-- /layout-wrapper -->

  <!-- Data layer (populated by your CMS / build step) -->
  <script src="js/script.js"></script>

  <!-- App (use type="module" if not bundling) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
